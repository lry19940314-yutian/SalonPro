<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bottom-sheet-gradient {
            background: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(255,248,248,1) 100%);
        }
        /* Custom scrollbar for the form area */
        .form-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .form-scroll::-webkit-scrollbar-thumb {
            background: #dac0c9;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "tertiary-container": "#328517",
                        "on-secondary-container": "#6c4082",
                        "inverse-primary": "#ffafd3",
                        "secondary-container": "#e8b3fe",
                        "surface-tint": "#a52f72",
                        "surface-container-low": "#fff0f4",
                        "on-secondary": "#ffffff",
                        "surface-container": "#fde9ef",
                        "secondary": "#794c8f",
                        "on-tertiary-fixed": "#042100",
                        "tertiary-fixed-dim": "#84db64",
                        "surface": "#fff8f8",
                        "on-primary-fixed": "#3d0025",
                        "tertiary-fixed": "#9ff87d",
                        "primary-container": "#c14689",
                        "primary": "#a22c70",
                        "secondary-fixed-dim": "#e8b3fe",
                        "tertiary": "#1c6b00",
                        "background": "#fff8f8",
                        "outline": "#88717a",
                        "secondary-fixed": "#f6d9ff",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#392d32",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#fffbff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#145200",
                        "surface-dim": "#e8d5db",
                        "inverse-on-surface": "#ffecf1",
                        "on-surface": "#23191d",
                        "surface-container-high": "#f7e3e9",
                        "primary-fixed-dim": "#ffafd3",
                        "on-secondary-fixed": "#300247",
                        "outline-variant": "#dac0c9",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#861259",
                        "surface-variant": "#f1dee3",
                        "on-secondary-fixed-variant": "#603475",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#554149",
                        "surface-container-highest": "#f1dee3",
                        "on-tertiary-container": "#f8ffee",
                        "primary-fixed": "#ffd8e7",
                        "on-error": "#ffffff",
                        "surface-bright": "#fff8f8",
                        "on-background": "#23191d",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        caption: ["Plus Jakarta Sans"],
                        h2: ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        h1: ["Plus Jakarta Sans"],
                        h3: ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        caption: ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        h2: ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        h1: ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        h3: ["18px", { lineHeight: "24px", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#23191d]/60 font-body-md text-on-surface h-screen w-full flex items-end overflow-hidden">
<!-- Bottom Sheet Container -->
<div class="w-full bg-white rounded-t-[28px] flex flex-col max-h-[813px] shadow-2xl relative animate-slide-up">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-3 pb-2">
<div class="w-10 h-1 rounded-full bg-outline-variant"></div>
</div>
<!-- Header -->
<div class="px-6 py-4 flex justify-between items-center border-b border-surface-container-high">
<div class="w-10"></div> <!-- Spacer -->
<h1 class="font-h1 text-h2 text-primary">門店其他收入</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-primary active:opacity-70">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Scrollable Form Area -->
<div class="flex-1 overflow-y-auto px-6 py-6 space-y-5 form-scroll">
<!-- Date Picker -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">記錄時間</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-primary">calendar_month</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all" readonly="" type="text" value="2026-03-05"/>
</div>
</div>
<!-- Time Picker -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">時間</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-primary">schedule</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all" readonly="" type="text" value="下午03:33"/>
</div>
</div>
<!-- Store Selector -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">門店</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-primary">storefront</span>
<select class="w-full h-[48px] pl-12 pr-10 bg-surface border border-outline-variant rounded-lg font-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
<option>沐茉珐複合式國際美妍館</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Income Type -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">收入型態</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-primary">category</span>
<select class="w-full h-[48px] pl-12 pr-10 bg-surface border border-outline-variant rounded-lg font-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
<option>日</option>
<option>月</option>
<option>單次</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-outline-variant pointer-events-none">expand_more</span>
</div>
<p class="font-caption text-on-surface-variant px-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span> 按天記錄收入
                </p>
</div>
<!-- Income Category -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">收入科目</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-primary">account_tree</span>
<select class="w-full h-[48px] pl-12 pr-10 bg-surface border border-outline-variant rounded-lg font-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface-variant">
<option disabled="" selected="">請選擇科目</option>
<option>美容保養品</option>
<option>課程包套</option>
<option>租金收入</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Name Input -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">名稱</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-primary">edit_note</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline" placeholder="請輸入收入名稱" type="text"/>
</div>
</div>
<!-- Amount Input -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">金額</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-primary">payments</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all" type="number" value="0"/>
</div>
</div>
<!-- Remarks -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant block">備註</label>
<div class="relative flex group">
<span class="material-symbols-outlined absolute left-4 top-3.5 text-primary">description</span>
<textarea class="w-full min-h-[100px] pl-12 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline resize-none" placeholder="請輸入備註內容"></textarea>
</div>
</div>
<!-- Accounting Option -->
<div class="space-y-1.5 pb-4">
<label class="font-label-md text-on-surface-variant block">入帳選項</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-primary">account_balance_wallet</span>
<select class="w-full h-[48px] pl-12 pr-10 bg-surface border border-outline-variant rounded-lg font-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
<option>入帳當日現金</option>
<option>入帳銀行轉帳</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-outline-variant pointer-events-none">expand_more</span>
</div>
<p class="font-caption text-on-surface-variant px-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span> 金額將直接存入當日現金帳戶
                </p>
</div>
</div>
<!-- Footer Actions -->
<div class="px-6 py-4 bg-white border-t border-surface-container-high flex gap-4 pb-10">
<button class="flex-1 h-[48px] rounded-lg font-body-lg font-semibold text-outline hover:bg-surface-variant transition-colors active:scale-95">
                取消
            </button>
<button class="flex-1 h-[48px] rounded-lg font-body-lg font-semibold bg-outline-variant text-white cursor-not-allowed opacity-70" disabled="">
                儲存
            </button>
</div>
</div>
<!-- Background Hero Section for context (Hidden by the sheet) -->
<div class="fixed inset-0 -z-10 bg-background overflow-hidden">
<div class="p-4">
<div class="w-full h-32 rounded-xl bg-surface-container-highest animate-pulse mb-4"></div>
<div class="space-y-4">
<div class="w-full h-20 rounded-xl bg-surface-container-high animate-pulse"></div>
<div class="w-full h-20 rounded-xl bg-surface-container-high animate-pulse"></div>
<div class="w-full h-20 rounded-xl bg-surface-container-high animate-pulse"></div>
</div>
</div>
<!-- Decorative Brand Background -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-3xl"></div>
</div>
<!-- Navigation Components from JSON Guidance -->
<nav class="fixed top-0 left-0 w-full h-16 bg-white flex justify-between items-center px-4 z-[70] border-b border-gray-100 shadow-sm opacity-50 pointer-events-none">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">menu</span>
<span class="font-['Plus_Jakarta_Sans'] font-extrabold tracking-tight text-xl text-primary">Wonder sky</span>
</div>
<span class="material-symbols-outlined text-primary">notifications</span>
</nav>
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-white/80 backdrop-blur-md border-t border-gray-100 opacity-50 pointer-events-none">
<div class="flex flex-col items-center justify-center text-primary bg-primary/5 rounded-xl px-3 py-1">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">首頁</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400">
<span class="material-symbols-outlined">event_available</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">預約</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">報表</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">設定</span>
</div>
</footer>
<!-- Visual Identity Background Mask -->
<div class="fixed inset-0 pointer-events-none">
<img class="hidden" data-alt="A professional and luxury beauty salon interior with soft rose gold accents, marble surfaces, and minimalist furniture. The lighting is warm and inviting, creating a high-end spa atmosphere that reflects the Wonder Sky brand identity. Pure white walls contrast with delicate floral arrangements and premium skincare products on display in a modern, light-filled environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCK1D1-sTJhRWr6s5_O3vLqRqJ955TAOgcEK7MyAwwt56kr3s2rS1nabvF1m3Fmp8UNr4LnAcuyI62xI2U8HJ26VAYjzywhsh7RGnZWgkbooi0OiAUzIpKs1u_LnBUJ8ahH2470mO68QEfcH4WS8anFGibuwU1K5xA-nzM-xLJq9QgGWXUytsKrSDKbgUju1cf1JRpKX1UKw6pnAxEPWDi7YCsTsCWt1qxXbEXfnF05nIJjJpa04F8wfn_N8eTZTbCNWF3hf0ZYXxw"/>
</div>
</body></html>
