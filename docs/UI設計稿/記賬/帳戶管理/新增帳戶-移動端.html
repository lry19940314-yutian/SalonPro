<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#e8d5db",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#e8b3fe",
                    "on-secondary-container": "#6c4082",
                    "on-secondary-fixed": "#300247",
                    "on-surface": "#23191d",
                    "on-tertiary-fixed-variant": "#145200",
                    "on-primary": "#ffffff",
                    "primary": "#a22c70",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#f1dee3",
                    "outline-variant": "#dac0c9",
                    "surface-container-low": "#fff0f4",
                    "on-primary-container": "#fffbff",
                    "surface-variant": "#f1dee3",
                    "surface-container": "#fde9ef",
                    "on-surface-variant": "#554149",
                    "secondary-container": "#e8b3fe",
                    "on-tertiary-container": "#f8ffee",
                    "surface": "#fff8f8",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "on-secondary-fixed-variant": "#603475",
                    "on-primary-fixed-variant": "#861259",
                    "secondary-fixed": "#f6d9ff",
                    "on-tertiary": "#ffffff",
                    "outline": "#88717a",
                    "tertiary-container": "#328517",
                    "primary-fixed-dim": "#ffafd3",
                    "on-tertiary-fixed": "#042100",
                    "background": "#fff8f8",
                    "surface-bright": "#fff8f8",
                    "inverse-surface": "#392d32",
                    "on-error": "#ffffff",
                    "secondary": "#794c8f",
                    "primary-fixed": "#ffd8e7",
                    "tertiary": "#1c6b00",
                    "surface-container-high": "#f7e3e9",
                    "surface-tint": "#a52f72",
                    "primary-container": "#c14689",
                    "on-primary-fixed": "#3d0025",
                    "tertiary-fixed": "#9ff87d",
                    "tertiary-fixed-dim": "#84db64",
                    "inverse-primary": "#ffafd3",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#23191d",
                    "inverse-on-surface": "#ffecf1"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "lg": "24px",
                    "container-padding": "24px",
                    "xs": "4px",
                    "md": "16px",
                    "unit": "4px",
                    "sm": "8px",
                    "gutter": "20px"
            },
            "fontFamily": {
                    "body-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Plus Jakarta Sans"],
                    "h1": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "h2": ["Plus Jakarta Sans"],
                    "caption": ["Plus Jakarta Sans"],
                    "h3": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "h1": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "h2": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-surface font-body-md overflow-hidden">
<!-- Mock Background Content (Simulating Dashboard) -->
<div class="fixed inset-0 z-0 p-6 flex flex-col gap-6 opacity-40">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="text-primary font-bold text-h1">Wonder Sky</span>
<span class="text-on-surface-variant text-caption">國際美妍館</span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant/30">
<div class="text-caption text-on-surface-variant">今日營收</div>
<div class="text-h2 text-primary font-bold">NT$ 12,480</div>
</div>
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant/30">
<div class="text-caption text-on-surface-variant">預約人數</div>
<div class="text-h2 text-tertiary font-bold">18</div>
</div>
</div>
<div class="flex-1 bg-surface-container-lowest rounded-xl border border-outline-variant/30 p-4">
<div class="h-4 w-1/3 bg-surface-variant rounded mb-4"></div>
<div class="space-y-3">
<div class="h-12 bg-surface-container rounded-lg"></div>
<div class="h-12 bg-surface-container rounded-lg"></div>
<div class="h-12 bg-surface-container rounded-lg"></div>
<div class="h-12 bg-surface-container rounded-lg"></div>
</div>
</div>
</div>
<!-- Overlay Mask -->
<div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm transition-opacity duration-300"></div>
<!-- Bottom Sheet Container -->
<div class="fixed inset-x-0 bottom-0 z-50 transform transition-transform duration-500 ease-out flex justify-center">
<div class="w-full max-w-md bg-surface rounded-t-[32px] shadow-[0_-12px_40px_rgba(0,0,0,0.15)] flex flex-col overflow-hidden border-t border-outline-variant/20">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-10 h-1.5 bg-outline-variant rounded-full opacity-50"></div>
</div>
<!-- Header -->
<div class="relative flex items-center justify-center px-lg py-4">
<button aria-label="Close" class="absolute left-lg w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px] text-[#c84c8f]">close</span>
</button>
<h2 class="font-h2 text-on-surface">新增帳戶</h2>
</div>
<!-- Form Content -->
<div class="flex-1 overflow-y-auto px-lg pb-10 space-y-6">
<!-- Branch Selection -->
<div class="space-y-2">
<label class="flex items-center font-label-md text-on-surface-variant">
                        門店 <span class="text-error ml-1">*</span>
</label>
<div class="relative">
<select class="w-full h-14 pl-4 pr-10 bg-white border border-outline rounded-xl appearance-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-lg">
<option disabled="" selected="" value="">請選擇所屬門店</option>
<option value="main">Wonder Sky 總店</option>
<option value="taipei">台北大安分館</option>
<option value="taichung">台中西屯分館</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Account Name -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="flex items-center font-label-md text-on-surface-variant">
                            名稱 <span class="text-error ml-1">*</span>
</label>
<span class="text-caption text-outline">0/20</span>
</div>
<input class="w-full h-14 px-4 bg-white border border-outline rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-lg placeholder:text-outline-variant" placeholder="請輸入帳戶名稱" type="text"/>
</div>
<!-- Account Type -->
<div class="space-y-2">
<label class="flex items-center font-label-md text-on-surface-variant">
                        類型 <span class="text-error ml-1">*</span>
</label>
<div class="relative">
<select class="w-full h-14 pl-4 pr-10 bg-white border border-outline rounded-xl appearance-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-lg">
<option disabled="" selected="" value="">請選擇帳戶類型</option>
<option value="cash">現金帳戶</option>
<option value="bank">銀行轉帳</option>
<option value="credit">信用卡結算</option>
<option value="third_party">第三方支付</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Initial Balance -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">初始餘額</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-on-surface-variant font-semibold">NT$</span>
<input class="w-full h-14 pl-14 pr-4 bg-white border border-outline rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-lg font-semibold" type="number" value="0"/>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-4 pt-4">
<button class="flex-1 h-14 rounded-xl border border-outline font-h3 text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95">
                        取消
                    </button>
<button class="flex-[2] h-14 rounded-xl bg-outline-variant text-white font-h3 cursor-not-allowed transition-all" disabled="">
                        儲存
                    </button>
</div>
</div>
<!-- Bottom Safe Area -->
<div class="h-6 bg-surface"></div>
</div>
</div>
<!-- Sticky Bottom NavBar (Mocked based on JSON) -->
<nav class="fixed bottom-0 left-0 w-full z-[60] flex justify-around items-center px-4 py-3 pb-safe bg-white/95 backdrop-blur-lg border-t border-zinc-100 opacity-20 pointer-events-none">
<div class="flex flex-col items-center text-zinc-400">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">首頁</span>
</div>
<div class="flex flex-col items-center text-[#c84c8f] scale-105">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">記帳</span>
</div>
<div class="flex flex-col items-center text-zinc-400">
<span class="material-symbols-outlined">analytics</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">報表</span>
</div>
<div class="flex flex-col items-center text-zinc-400">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium font-['Plus_Jakarta_Sans']">我的</span>
</div>
</nav>
</body></html>
