<body class="bg-background text-on-background min-h-screen">
<!-- Mobile Background Layer (Mock of the main dashboard) -->
<div class="fixed inset-0 p-lg opacity-40">
<header class="flex items-center justify-between mb-lg">
<h1 class="text-h1">帳戶管理</h1>
<span class="material-symbols-outlined text-primary">search</span>
</header>
<div class="space-y-md">
<div class="h-32 bg-surface-container rounded-xl p-md flex flex-col justify-between">
<div class="text-label-md text-on-surface-variant">總餘額</div>
<div class="text-h1 font-bold">NT$ 1,280,500</div>
</div>
<div class="h-24 bg-surface-container-low rounded-xl border border-outline-variant p-md"></div>
<div class="h-24 bg-surface-container-low rounded-xl border border-outline-variant p-md"></div>
</div>
</div>
<!-- Bottom Sheet Overlay -->
<div class="fixed inset-0 bg-inverse-surface/40 flex flex-col justify-end z-50">
<!-- BottomSheet Content -->
<div class="relative flex h-auto max-h-[92%] w-full flex-col bg-[#fbf9fa] rounded-t-[28px] overflow-hidden">
<!-- Shared Component: BottomSheetHandle (Partially integrated to maintain structure) -->
<button class="flex h-5 w-full items-center justify-center shrink-0">
<div class="h-1 w-9 rounded-full bg-[#e3d4dc]"></div>
</button>
<div class="overflow-y-auto pb-lg">
<!-- Shared Header Section -->
<div class="flex items-center bg-[#fbf9fa] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-surface-container-high/50">
<h2 class="text-[#191015] text-lg font-bold leading-tight tracking-[-0.015em] flex-1">編輯沐茉珐國際美妍館明細</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-primary gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<div class="text-primary" data-icon="X" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-2xl" style="font-weight: 700;">close</span>
</div>
</button>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-unit px-4 py-3">
<!-- Record Time -->
<div class="flex flex-col flex-1 pb-3">
<p class="text-[#191015] text-base font-medium leading-normal pb-2">記錄時間</p>
<select class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#191015] focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e3d4dc] bg-[#fbf9fa] focus:border-primary h-14 placeholder:text-[#8b5b74] px-[15px] text-base font-normal leading-normal appearance-none bg-[right_15px_center] bg-no-repeat" style="background-image: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(139,91,116)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e');">
<option value="2023-10-27T14:30">2023年10月27日 14:30</option>
<option value="today">今天</option>
</select>
</div>

<option value="main">沐茉珐國際美妍館-旗艦店</option>
<option value="branch1">沐茉珐國際美妍館-二店</option>
</select>
</div>
<!-- Type (Radio Group) -->
<div class="flex flex-col pb-3">
<h4 class="text-[#8b5b74] text-sm font-bold leading-normal tracking-[0.015em] py-2">類型 *</h4>
<div class="grid grid-cols-2 gap-md mt-1">
<label class="relative flex items-center justify-center h-14 cursor-pointer rounded-lg border border-[#e3d4dc] bg-white has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/30 transition-all">
<input class="sr-only" name="type" type="radio" value="income"/>
<span class="text-on-surface font-medium">收入</span>
</label>
<label class="relative flex items-center justify-center h-14 cursor-pointer rounded-lg border-2 border-primary bg-primary-fixed/30 transition-all">
<input checked="" class="sr-only" name="type" type="radio" value="expense"/>
<span class="text-primary font-bold">支出</span>
<div class="absolute top-1 right-1">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
</div>
</div>
<!-- Expense Category -->
<div class="flex flex-col flex-1 pb-3">
<p class="text-[#191015] text-base font-medium leading-normal pb-2">支出科目</p>

<option value="supplies">店內消耗品購入</option>
<option value="rent">場地租金</option>
<option value="salary">人員薪資</option>
</select>
</div>
<!-- Amount -->
<div class="flex flex-col flex-1 pb-3">
<p class="text-[#191015] text-base font-medium leading-normal pb-2">金額</p>
<div class="relative flex items-center">
<span class="absolute left-4 text-[#8b5b74]">NT$</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#191015] focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e3d4dc] bg-white focus:border-primary h-14 pl-12 pr-4 text-base font-bold leading-normal" type="number" value="4200"/>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col flex-1 pb-6">
<div class="flex justify-between items-center pb-2">
<p class="text-[#191015] text-base font-medium leading-normal">備註</p>
<span class="text-caption text-outline">0 / 200</span>
</div>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#191015] focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e3d4dc] bg-white focus:border-primary p-4 text-base font-normal leading-normal" placeholder="請輸入備註內容..." rows="3"></textarea>
</div>
</div>
<!-- Footer Buttons -->
<div class="flex items-center gap-md px-lg pt-2 pb-lg sticky bottom-0 bg-[#fbf9fa]">
<button class="flex-1 h-[52px] rounded-xl border border-outline text-on-surface font-bold text-base transition-colors hover:bg-surface-variant">取消</button>
<button class="flex-[2] h-[52px] rounded-xl bg-primary text-on-primary font-bold text-base shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">儲存</button>
</div>
</div>
</div>
</div>

</div>
