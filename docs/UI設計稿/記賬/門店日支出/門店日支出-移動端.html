<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>

<title>Wonder Sky - 門店日支出</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fff8f8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white border-b border-gray-100">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-600" data-icon="menu">menu</span>
<h1 class="text-[#c84c8f] font-extrabold text-xl font-['Plus_Jakarta_Sans'] tracking-tight">Wonder Sky</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-gray-500" data-icon="notifications">notifications</span>
</div>
</header>
<main class="flex-grow pt-20 pb-24 px-4 max-w-md mx-auto w-full">
<!-- Breadcrumb Navigation -->
<nav class="mb-4">
<div class="flex items-center gap-1 text-gray-500 font-label-md text-label-md">
<span>記帳</span>
<span class="material-symbols-outlined text-[14px]" data-icon="chevron_right">chevron_right</span>
<span class="text-on-surface-variant">門店日支出</span>
</div>
</nav>
<!-- Total Card -->
<section class="mb-6">
<div class="bg-white rounded-lg p-lg flex flex-col items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.04)] border border-gray-100">
<span class="text-on-surface-variant font-label-md text-label-md mb-2">總額</span>
<span class="text-[#c84c8f] font-h1 text-[32px] font-extrabold">$0</span>
</div>
</section>
<!-- Filters Section -->
<section class="space-y-4 mb-8">
<!-- Search Box -->
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" data-icon="search">search</span>
<input class="w-full h-11 pl-10 pr-4 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#c84c8f]/20 focus:border-[#c84c8f] outline-none text-body-md font-body-md transition-all" placeholder="搜尋名稱、金額與備註" type="text"/>
</div>
<!-- Expense Category Select -->
<div class="relative">
<select class="w-full h-11 px-4 bg-white border border-gray-200 rounded-lg appearance-none focus:ring-2 focus:ring-[#c84c8f]/20 focus:border-[#c84c8f] outline-none text-body-md font-body-md transition-all">
<option disabled="" selected="" value="">支出科目</option>
<option value="rent">場地租金</option>
<option value="salary">人事薪資</option>
<option value="utility">水電瓦斯</option>
<option value="inventory">耗材採購</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
<!-- Date Range Input -->
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" data-icon="calendar_month">calendar_month</span>
<input class="w-full h-11 pl-10 pr-4 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#c84c8f]/20 focus:border-[#c84c8f] outline-none text-body-md font-body-md transition-all" readonly="" type="text" value="2026-03-01 - 2026-03-31"/>
</div>
</section>
<!-- Empty State Area -->
<section class="flex flex-col items-center justify-center py-12">
<div class="mb-6 relative">
<!-- Abstract visual representation of empty state using Material Symbols -->
<div class="relative w-32 h-32 flex items-center justify-center bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-gray-300 text-[64px]" data-icon="description">description</span>
<span class="material-symbols-outlined text-gray-400 text-[32px] absolute bottom-4 right-4 bg-white rounded-full p-1 border border-gray-100" data-icon="search">search</span>
</div>
</div>
<p class="text-gray-400 font-body-lg text-body-lg">目前沒有日支出記錄</p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-6 bg-white/95 backdrop-blur-md border-t border-gray-100 shadow-[0_-2px_10px_rgba(0,0,0,0.04)]">
<!-- 首頁 -->
<a class="flex flex-col items-center justify-center text-gray-400 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">首頁</span>
</a>
<!-- 記帳 - ACTIVE -->
<a class="flex flex-col items-center justify-center text-[#c84c8f] scale-110 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">記帳</span>
</a>
<!-- 預約 -->
<a class="flex flex-col items-center justify-center text-gray-400 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="calendar_month">calendar_month</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">預約</span>
</a>
<!-- 我的 -->
<a class="flex flex-col items-center justify-center text-gray-400 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">我的</span>
</a>
</nav>
<!-- Floating Action Button for Adding Expense (Standard Pattern for Expense pages) -->
<button class="fixed right-6 bottom-24 w-14 h-14 bg-[#c84c8f] text-white rounded-full shadow-xl flex items-center justify-center active:scale-90 transition-transform z-40">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</body></html>
