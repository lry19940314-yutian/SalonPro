<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-blur {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#c14689",
                        "secondary": "#794c8f",
                        "on-primary-fixed": "#3d0025",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#fffbff",
                        "tertiary-container": "#328517",
                        "surface-tint": "#a52f72",
                        "inverse-on-surface": "#ffecf1",
                        "secondary-fixed": "#f6d9ff",
                        "surface-container-highest": "#f1dee3",
                        "secondary-fixed-dim": "#e8b3fe",
                        "tertiary-fixed": "#9ff87d",
                        "surface-variant": "#f1dee3",
                        "surface-dim": "#e8d5db",
                        "on-tertiary-fixed": "#042100",
                        "outline": "#88717a",
                        "error-container": "#ffdad6",
                        "outline-variant": "#dac0c9",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#84db64",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#fff0f4",
                        "on-surface-variant": "#554149",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#145200",
                        "on-secondary-fixed": "#300247",
                        "on-background": "#23191d",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#f8ffee",
                        "on-secondary-fixed-variant": "#603475",
                        "on-primary": "#ffffff",
                        "surface-container": "#fde9ef",
                        "primary": "#a22c70",
                        "inverse-surface": "#392d32",
                        "tertiary": "#1c6b00",
                        "surface": "#fff8f8",
                        "secondary-container": "#e8b3fe",
                        "on-secondary-container": "#6c4082",
                        "on-surface": "#23191d",
                        "primary-fixed": "#ffd8e7",
                        "background": "#fff8f8",
                        "primary-fixed-dim": "#ffafd3",
                        "inverse-primary": "#ffafd3",
                        "surface-bright": "#fff8f8",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#f7e3e9",
                        "on-primary-fixed-variant": "#861259"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "sm": "8px",
                        "gutter": "20px",
                        "container-padding": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "unit": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "h2": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "h2": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "h1": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden">
<!-- Background Content (Blurred Staff Table) -->
<div class="fixed inset-0 z-0 flex flex-col glass-blur opacity-50 pointer-events-none">
<!-- TopAppBar Mockup -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 shadow-sm flex justify-between items-center w-full px-4 h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-500">menu</span>
<span class="text-lg font-bold text-slate-800 dark:text-white font-['Plus_Jakarta_Sans']">Wonder sky</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-slate-500">notifications</span>
<div class="w-8 h-8 rounded-full bg-primary-container"></div>
</div>
</header>
<main class="p-lg flex-1">
<div class="max-w-7xl mx-auto space-y-lg">
<div class="flex justify-between items-end">
<h1 class="font-h1 text-h1 text-on-surface">員工管理</h1>
<button class="bg-primary text-white px-md py-sm rounded-lg font-label-md">新增人員</button>
</div>
<div class="bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden">
<table class="w-full text-left">
<thead class="bg-surface-container-low text-on-surface-variant font-label-md">
<tr>
<th class="px-lg py-md">員工姓名</th>
<th class="px-lg py-md">職位</th>
<th class="px-lg py-md">服務項目</th>
<th class="px-lg py-md">狀態</th>
<th class="px-lg py-md">操作</th>
</tr>
</thead>
<tbody class="divide-y divide-outline-variant">
<tr class="text-body-md">
<td class="px-lg py-md flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-slate-200"></div>
<span class="font-semibold">LULU</span>
</td>
<td class="px-lg py-md">資深美療師</td>
<td class="px-lg py-md">臉部護理, 身體SPA</td>
<td class="px-lg py-md"><span class="bg-tertiary-fixed text-on-tertiary-fixed px-2 py-1 rounded text-caption">在職</span></td>
<td class="px-lg py-md text-primary">編輯</td>
</tr>
<tr class="text-body-md">
<td class="px-lg py-md flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-slate-200"></div>
<span class="font-semibold">君君</span>
</td>
<td class="px-lg py-md">美睫師</td>
<td class="px-lg py-md">韓式美睫</td>
<td class="px-lg py-md"><span class="bg-tertiary-fixed text-on-tertiary-fixed px-2 py-1 rounded text-caption">在職</span></td>
<td class="px-lg py-md text-primary">編輯</td>
</tr>
</tbody>
</table>
</div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-[#23191d]/60 backdrop-blur-sm px-md">
<!-- Modal Dialog -->
<div class="bg-white w-full max-w-[440px] rounded-xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="bg-slate-50 border-b border-slate-100 flex items-center justify-between px-lg h-16">
<div class="w-10"></div> <!-- Spacer for centering -->
<h2 class="font-h2 text-h2 text-on-surface text-center">推曳工作人員進行排序</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-pink-50 transition-colors text-primary">
<span class="material-symbols-outlined font-bold">close</span>
</button>
</div>
<!-- Modal Content (Staff List) -->
<div class="p-lg space-y-md">
<div class="space-y-sm">
<!-- Staff Item 1 -->
<div class="group flex items-center justify-between p-md bg-white border border-outline-variant rounded-lg shadow-sm hover:bg-slate-50 hover:border-primary/30 transition-all cursor-move active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="font-h3 text-h3 text-primary/60 w-6">1</span>
<span class="font-body-lg text-on-surface font-medium">LULU</span>
</div>
<div class="text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
</div>
<!-- Staff Item 2 -->
<div class="group flex items-center justify-between p-md bg-white border border-outline-variant rounded-lg shadow-sm hover:bg-slate-50 hover:border-primary/30 transition-all cursor-move active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="font-h3 text-h3 text-primary/60 w-6">2</span>
<span class="font-body-lg text-on-surface font-medium">君君</span>
</div>
<div class="text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
</div>
<!-- Staff Item 3 -->
<div class="group flex items-center justify-between p-md bg-white border border-outline-variant rounded-lg shadow-sm hover:bg-slate-50 hover:border-primary/30 transition-all cursor-move active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="font-h3 text-h3 text-primary/60 w-6">3</span>
<span class="font-body-lg text-on-surface font-medium">小曼</span>
</div>
<div class="text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
</div>
<!-- Staff Item 4 -->
<div class="group flex items-center justify-between p-md bg-white border border-outline-variant rounded-lg shadow-sm hover:bg-slate-50 hover:border-primary/30 transition-all cursor-move active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="font-h3 text-h3 text-primary/60 w-6">4</span>
<span class="font-body-lg text-on-surface font-medium">Vicky</span>
</div>
<div class="text-slate-400 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">drag_indicator</span>
</div>
</div>
</div>
<!-- Footer Buttons -->
<div class="flex gap-md pt-md">
<button class="flex-1 py-3 px-md border border-primary text-primary font-label-md rounded-lg hover:bg-pink-50 transition-colors">取消</button>
<button class="flex-1 py-3 px-md bg-primary text-white font-label-md rounded-lg shadow-md shadow-primary/20 hover:bg-primary-container transition-colors">儲存排序</button>
</div>
</div>
<!-- Branding Hint -->
<div class="px-lg pb-lg flex items-center justify-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary/30"></span>
<p class="text-caption text-slate-400 font-medium">Wonder sky 國際美妍館 系統設定</p>
<span class="w-1.5 h-1.5 rounded-full bg-primary/30"></span>
</div>
</div>
</div>
</body></html>
