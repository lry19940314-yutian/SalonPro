<body class="bg-slate-100 font-body-md text-on-surface min-h-screen relative overflow-hidden">
<!-- Background Content Placeholder (Behind Modal) -->
<header class="bg-white dark:bg-slate-900 border-b border-gray-100 dark:border-gray-800 shadow-sm flex justify-between items-center w-full px-4 h-16 font-['Plus_Jakarta_Sans'] antialiased">

<span class="material-symbols-outlined text-pink-600">menu</span>
<span class="text-lg font-bold tracking-tight text-pink-600">Wonder Sky</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-pink-600" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</header>
<main class="p-4 space-y-4">
<div class="h-32 bg-white rounded-xl shadow-sm border border-outline-variant/30 flex items-center justify-center text-outline">
            場務表視圖內容載入中...
        </div>
<div class="h-64 bg-white rounded-xl shadow-sm border border-outline-variant/30 flex items-center justify-center text-outline">
            預約時段看板載入中...
        </div>
</main>
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-end">
<!-- Bottom Sheet Container -->
<div class="w-full bg-surface-container-low rounded-t-[24px] shadow-2xl max-h-[813px] flex flex-col transition-transform duration-300 translate-y-0 relative">
<!-- Handle -->
<div class="w-full flex justify-center py-3">
<div class="w-12 h-1.5 bg-outline-variant rounded-full opacity-50"></div>
</div>
<!-- Header -->
<div class="px-6 pb-4 flex justify-between items-center border-b border-outline-variant/20">
<div class="w-10"></div> <!-- Spacer for centering -->
<h2 class="font-h1 text-on-surface">預約</h2>
<button class="w-10 h-10 flex items-center justify-center active:bg-primary-fixed-dim rounded-full transition-colors">
<span class="material-symbols-outlined text-primary text-[32px]">close</span>
</button>
</div>

<div class="flex-1 overflow-y-auto no-scrollbar px-6 py-4 space-y-6">
<!-- 1. 預約資訊模組 -->
<section class="space-y-4 bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/10">
<div class="flex items-center gap-2 mb-2">
<div class="w-1 h-5 bg-primary rounded-full"></div>
<h3 class="font-h3 text-primary">預約資訊</h3>
</div>
<div class="grid grid-cols-1 gap-4">
<!-- Date -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
                                預約日期<span class="text-error">*</span>
</label>
<div class="relative h-12 flex items-center px-4 bg-white border border-outline-variant rounded-xl focus-within:border-primary focus-within:ring-1 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-outline mr-2">calendar_month</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-lg" readonly="" type="text" value="2023-11-20"/>
</div>
</div>
<!-- Time Cluster -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant">預約時間<span class="text-error">*</span></label>
<div class="h-12 flex items-center px-4 bg-white border border-outline-variant rounded-xl text-body-lg">
                                    14:30
                                </div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant">預約緩衝時間</label>
<div class="h-12 flex items-center px-4 bg-white border border-outline-variant rounded-xl text-body-lg">
                                    15 min
                                </div>
</div>
</div>
<!-- Store & Staff -->
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant">門店<span class="text-error">*</span></label>
<div class="h-12 flex items-center justify-between px-4 bg-white border border-outline-variant rounded-xl text-body-lg">
<span>台北忠孝旗艦店</span>
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant">工作人員<span class="text-error">*</span></label>
<div class="h-12 flex items-center justify-between px-4 bg-white border border-outline-variant rounded-xl text-body-lg">
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-primary-fixed-dim text-[10px] flex items-center justify-center font-bold">AN</div>
<span>Anita 老師</span>
</div>
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
</section>

</div>
<div class="space-y-4">

<label class="font-label-md text-on-surface-variant">姓名<span class="text-error">*</span></label>
<div class="flex gap-2">
<div class="relative flex-1 h-12 flex items-center px-4 bg-white border border-outline-variant rounded-xl">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-lg" placeholder="請輸入姓名或點擊搜尋" type="text"/>
</div>
<button class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white">add</span>
</button>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant">手機號碼<span class="text-error">*</span></label>
<div class="h-12 flex items-center px-4 bg-white border border-outline-variant rounded-xl text-body-lg">
<input class="w-full bg-transparent border-none p-0 focus:ring-0" placeholder="09XX-XXX-XXX" type="tel"/>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-on-surface-variant">性別<span class="text-error">*</span></label>

<button class="flex-1 h-12 rounded-xl border border-primary bg-primary-fixed text-primary font-bold flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">female</span> 女
                                </button>
<button class="flex-1 h-12 rounded-xl border border-outline-variant bg-white text-outline font-bold flex items-center justify-center gap-2">
<span class="material-symbols-outlined">male</span> 男

</div>
</div>
<p class="text-caption text-outline text-center mt-2">

                        </p>
</div>
</section>

<section class="space-y-4 bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-outline-variant/10">

<div class="w-1 h-5 bg-primary rounded-full"></div>

</div>
<div class="space-y-4">

</div>

</div>
<div class="w-14 h-8 bg-primary rounded-full relative flex items-center px-1">

</div>
</div>
<div class="flex items-center justify-between p-3 bg-surface-container-low rounded-xl">
<div class="flex items-center gap-2">

</div>

                    儲存預約

<div class="flex flex-col items-center justify-center text-pink-600 bg-pink-50/50 rounded-xl px-3 py-1">
<span class="material-symbols-outlined">calendar_month</span>
<span>預約</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400">
<span class="material-symbols-outlined">person_search</span>
<span>顧客</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400">
<span class="material-symbols-outlined">analytics</span>
<span>報表</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400">
<span class="material-symbols-outlined">settings</span>
<span>設定</span>
</div>
</nav>
