<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#ffd8e7",
                        "secondary-fixed-dim": "#e8b3fe",
                        "on-secondary": "#ffffff",
                        "on-surface": "#23191d",
                        "secondary-container": "#e8b3fe",
                        "background": "#fff8f8",
                        "tertiary-container": "#328517",
                        "on-tertiary-fixed-variant": "#145200",
                        "on-primary-fixed-variant": "#861259",
                        "on-background": "#23191d",
                        "outline": "#88717a",
                        "on-secondary-fixed": "#300247",
                        "surface-variant": "#f1dee3",
                        "inverse-on-surface": "#ffecf1",
                        "inverse-surface": "#392d32",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#f1dee3",
                        "primary": "#a22c70",
                        "on-primary-fixed": "#3d0025",
                        "surface-tint": "#a52f72",
                        "primary-fixed-dim": "#ffafd3",
                        "on-tertiary-fixed": "#042100",
                        "on-surface-variant": "#554149",
                        "surface-dim": "#e8d5db",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#fff0f4",
                        "tertiary-fixed-dim": "#84db64",
                        "tertiary": "#1c6b00",
                        "on-secondary-fixed-variant": "#603475",
                        "primary-container": "#c14689",
                        "on-secondary-container": "#6c4082",
                        "on-primary-container": "#fffbff",
                        "surface-bright": "#fff8f8",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#f6d9ff",
                        "surface": "#fff8f8",
                        "outline-variant": "#dac0c9",
                        "tertiary-fixed": "#9ff87d",
                        "surface-container-high": "#f7e3e9",
                        "on-tertiary-container": "#f8ffee",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#794c8f",
                        "on-error": "#ffffff",
                        "inverse-primary": "#ffafd3",
                        "on-error-container": "#93000a",
                        "surface-container": "#fde9ef"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "h1": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<!-- Modal Card -->
<div class="bg-surface-container-lowest w-full max-w-[800px] rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.15)] flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="relative px-lg py-md border-b border-outline-variant flex items-center justify-center">
<h1 class="font-h1 text-h1 text-on-surface">預約</h1>
<button class="absolute right-lg top-1/2 -translate-y-1/2 p-2 hover:bg-surface-container-high rounded-full transition-all text-primary">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content (Form Area) -->
<div class="overflow-y-auto max-h-[768px] p-lg space-y-xl">
<!-- 預約資訊模組 -->
<section class="space-y-md">
<div class="flex items-center gap-2 border-l-4 border-primary pl-3">
<h2 class="font-h2 text-h2 text-on-surface">預約資訊</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                預約日期 <span class="text-error">*</span>
</label>
<div class="relative group">
<input class="w-full h-11 px-4 pr-10 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" readonly="" type="text" value="2026-03-05"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Time -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                時間 <span class="text-error">*</span>
</label>
<select class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md appearance-none">
<option>15:00</option>
</select>
</div>
<!-- Store -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                門店 <span class="text-error">*</span>
</label>
<select class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md">
<option>沐茉珐複合式國際美妍館</option>
</select>
</div>
<!-- Staff -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                工作人員 <span class="text-error">*</span>
</label>
<select class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md">
<option>請選擇</option>
</select>
</div>
<!-- Buffer Time -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">預約緩衝時間</label>
<select class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md">
<option>無</option>
</select>
</div>
</div>
</section>
<!-- 會員資訊模組 -->
<section class="space-y-md">
<div class="flex items-center gap-2 border-l-4 border-primary pl-3">
<h2 class="font-h2 text-h2 text-on-surface">會員資訊</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Name Search -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                姓名 <span class="text-error">*</span>
</label>
<div class="flex gap-2">
<div class="relative flex-1">
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="輸入姓名或搜尋" type="text"/>
</div>
<button class="h-11 w-11 flex items-center justify-center rounded-lg bg-primary text-on-primary hover:opacity-90 transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
<p class="font-caption text-caption text-outline">輸入姓名或搜尋</p>
</div>
<!-- Phone -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                手機 <span class="text-error">*</span>
</label>
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="0912345678" type="tel"/>
</div>
<!-- Gender -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">性別</label>
<div class="flex h-11 items-center gap-4">
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="w-5 h-5 text-primary border-outline focus:ring-primary/20" name="gender" type="radio"/>
<span class="text-body-md text-on-surface">女</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary/20" name="gender" type="radio"/>
<span class="text-body-md text-on-surface">男</span>
</label>
</div>
</div>
</div>
</section>
<!-- 預約服務模組 -->
<section class="space-y-md">
<div class="flex items-center gap-2 border-l-4 border-primary pl-3">
<h2 class="font-h2 text-h2 text-on-surface">預約服務</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter items-end">
<!-- Service Select -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex gap-1">
                                預約服務 <span class="text-error">*</span>
</label>
<select class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md">
<option>請選擇服務項目</option>
</select>
</div>
<!-- Duration -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">預計工時 (分鐘)</label>
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" type="number" value="0"/>
</div>
<!-- People count -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">人數</label>
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" type="number" value="1"/>
</div>
<!-- Remark (Span 2 columns) -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant">備註</label>
<textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md resize-none" placeholder="請輸入備註內容..." rows="2"></textarea>
</div>
<!-- Toggles -->
<div class="flex items-center gap-6 h-11 pb-2">
<div class="flex items-center gap-2">
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-10 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
<span class="ml-2 font-label-md text-on-surface">指定</span>
</div>
</div>
<div class="flex items-center gap-2">
<div class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-10 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
<span class="ml-2 font-label-md text-on-surface">首次預約</span>
</div>
</div>
</div>
</div>
</section>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-outline-variant flex justify-end gap-md bg-surface-container-low">
<button class="px-8 h-11 rounded-lg border border-secondary text-secondary font-label-md hover:bg-secondary/5 transition-all">
                    取消
                </button>
<button class="px-8 h-11 rounded-lg bg-slate-200 text-slate-400 font-label-md cursor-not-allowed" disabled="">
                    儲存
                </button>
</div>
</div>
</div>
<!-- Page Content Background (Visual context only) -->
<main class="w-full h-full flex flex-col blur-sm opacity-20 pointer-events-none">
<header class="w-full bg-white border-b border-slate-200 p-6 flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold">W</div>
<h1 class="text-xl font-bold text-primary">Wonder Sky</h1>
</div>
<div class="flex gap-4">
<div class="w-32 h-10 bg-slate-100 rounded-lg"></div>
<div class="w-10 h-10 bg-slate-100 rounded-full"></div>
</div>
</header>
<div class="p-lg grid grid-cols-12 gap-gutter flex-1">
<div class="col-span-3 bg-white h-full rounded-xl p-6 space-y-4">
<div class="h-6 w-3/4 bg-slate-100 rounded"></div>
<div class="h-40 w-full bg-slate-50 rounded-lg"></div>
<div class="h-6 w-1/2 bg-slate-100 rounded"></div>
<div class="h-6 w-2/3 bg-slate-100 rounded"></div>
</div>
<div class="col-span-9 space-y-lg">
<div class="bg-white rounded-xl p-6 shadow-sm flex flex-col gap-4">
<div class="h-10 w-full bg-slate-50 rounded-lg"></div>
<div class="h-64 w-full bg-slate-50 rounded-lg"></div>
<div class="h-64 w-full bg-slate-50 rounded-lg"></div>
</div>
</div>
</div>
</main>
</body></html>
