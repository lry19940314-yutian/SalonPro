<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#a22c70",
                        "on-tertiary-fixed-variant": "#145200",
                        "surface-dim": "#e8d5db",
                        "surface-container-low": "#fff0f4",
                        "on-surface-variant": "#554149",
                        "on-secondary-container": "#6c4082",
                        "surface-bright": "#fff8f8",
                        "tertiary": "#1c6b00",
                        "inverse-surface": "#392d32",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "surface-tint": "#a52f72",
                        "outline": "#88717a",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#ffafd3",
                        "on-tertiary-container": "#f8ffee",
                        "on-background": "#23191d",
                        "outline-variant": "#dac0c9",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#fde9ef",
                        "tertiary-fixed": "#9ff87d",
                        "tertiary-fixed-dim": "#84db64",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#e8b3fe",
                        "on-secondary": "#ffffff",
                        "secondary": "#794c8f",
                        "on-surface": "#23191d",
                        "on-secondary-fixed-variant": "#603475",
                        "inverse-on-surface": "#ffecf1",
                        "on-tertiary-fixed": "#042100",
                        "primary-container": "#c14689",
                        "on-secondary-fixed": "#300247",
                        "inverse-primary": "#ffafd3",
                        "surface-container-high": "#f7e3e9",
                        "surface-container-highest": "#f1dee3",
                        "on-primary-fixed-variant": "#861259",
                        "on-primary-container": "#fffbff",
                        "surface": "#fff8f8",
                        "on-primary-fixed": "#3d0025",
                        "surface-variant": "#f1dee3",
                        "secondary-fixed": "#f6d9ff",
                        "tertiary-container": "#328517",
                        "primary-fixed": "#ffd8e7",
                        "background": "#fff8f8",
                        "secondary-container": "#e8b3fe"
                    },
                    "fontFamily": {
                        "h1": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-background overflow-hidden">
<!-- Background: Blurred Calendar View -->
<div class="fixed inset-0 z-0 flex blur-md opacity-40 overflow-hidden">
<!-- Sidebar Shell (From JSON) -->
<aside class="h-screen w-64 border-r border-slate-200 bg-white flex flex-col p-4 shadow-sm">
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">spa</span>
</div>
<div>
<h1 class="text-lg font-bold text-[#c84c8f]">Wonder sky</h1>
<p class="text-xs text-slate-500">國際美妍館</p>
</div>
</div>
<nav class="flex-1 space-y-1">
<div class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-lg"><span class="material-symbols-outlined">dashboard</span>資訊中心</div>
<div class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-lg"><span class="material-symbols-outlined">payments</span>財務中心</div>
<div class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-lg"><span class="material-symbols-outlined">receipt_long</span>記帳</div>
<div class="flex items-center gap-3 px-4 py-3 text-[#c84c8f] bg-[#c84c8f]/5 rounded-lg font-bold"><span class="material-symbols-outlined">calendar_month</span>預約</div>
<div class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-lg"><span class="material-symbols-outlined">group</span>會員</div>
<div class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-lg"><span class="material-symbols-outlined">inventory_2</span>服務及商品</div>
</nav>
</aside>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col">
<!-- TopAppBar Shell (From JSON) -->
<header class="sticky top-0 z-40 flex justify-between items-center px-6 w-full h-16 border-b border-slate-200 bg-white/80 backdrop-blur-md">
<span class="text-xl font-black tracking-tight text-slate-900">Wonder sky 國際美妍館</span>
<div class="flex items-center gap-4">
<div class="flex items-center gap-6 mr-6">
<span class="text-slate-500 text-sm font-['Plus_Jakarta_Sans']">財務中心</span>
<span class="text-slate-500 text-sm font-['Plus_Jakarta_Sans']">關帳</span>
</div>
<span class="material-symbols-outlined p-2 hover:bg-slate-100 rounded-full transition-all text-slate-600">notifications</span>
<button class="bg-[#c84c8f] text-white px-6 py-2 rounded-lg font-bold">開單</button>
<img alt="Avatar" class="w-8 h-8 rounded-full border border-slate-200" data-alt="A professional close-up portrait of a female spa manager with a friendly expression. She has neatly styled hair and wears a professional uniform. The background is a soft-focus high-end beauty salon with warm ambient lighting and elegant decor, maintaining a clean and professional corporate aesthetic consistent with a luxury wellness brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIoRrJSCS_P4YteFSOTL00hIEX-Ds55cqdLX3DhdItjCW9rgFYgRXcNQKgXLDCewTYmkBuIIvPfOUziUGTWldi5jCyPcsw4UPTIbDZruW-E3_KH22EbpwHDlLskGOkdj0Y3cS5876yA74XhpwODfEt3llzv7ws9xaWKqLovNRdBdwTbfjVnsO55vj4LAjc1JxmlArGSAqafRI12atLAQfOSlz9saLId0U13Nna-bZCzF0ZpXAHfZXOiJ006sQ0pXfBxb9yuCa-cgk"/>
</div>
</header>
<!-- Calendar View Mockup -->
<div class="p-lg grid grid-cols-7 gap-4 h-full content-start">
<div class="col-span-7 flex justify-between items-center mb-4">
<h2 class="text-h2 font-h2 text-on-background">預約總覽 (2026年3月)</h2>
<div class="flex gap-2">
<button class="px-4 py-2 border border-outline rounded-lg text-sm">今日</button>
<div class="flex border border-outline rounded-lg overflow-hidden">
<button class="px-4 py-2 bg-slate-100"><span class="material-symbols-outlined text-sm">chevron_left</span></button>
<button class="px-4 py-2 bg-slate-100 border-l border-outline"><span class="material-symbols-outlined text-sm">chevron_right</span></button>
</div>
</div>
</div>
<!-- Calendar Grid -->
<script>
                    for(let i=0; i<31; i++) {
                        document.write(`<div class="h-32 border border-slate-200 bg-white rounded-xl p-2 shadow-sm opacity-50">
                            <span class="text-xs font-bold text-slate-400">${i+1}</span>
                        </div>`);
                    }
                </script>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-[2px]">
<!-- Modal Card -->
<div class="bg-white w-full max-w-[560px] rounded-2xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
<div class="w-8"></div> <!-- Spacer for centering -->
<h2 class="text-h2 font-h2 text-on-background">關閉預約</h2>
<button class="text-[#c84c8f] hover:bg-primary-container/10 p-1 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Content -->
<div class="p-6 space-y-5 overflow-y-auto max-h-[819px]">
<!-- Toggle: Multiple Single Dates -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<span class="text-body-md font-label-md text-on-surface-variant">選擇多個單一日期</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<p class="text-caption text-slate-400">例: 2024-06-01, 2024-06-05, 2024-06-10</p>
</div>
<!-- Date Range Picker -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant">日期區間</label>
<div class="relative group">
<input class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none cursor-default" readonly="" type="text" value="2026-03-05 ~ 2026-03-05"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-hover:text-primary transition-colors">calendar_month</span>
</div>
</div>
<!-- Toggle: All Day -->
<div class="flex items-center justify-between py-2">
<span class="text-body-md font-label-md text-on-surface-variant">整日</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#c84c8f]"></div>
</label>
</div>
<!-- Time Selectors -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant">每日開始時間</label>
<select class="w-full px-4 py-2.5 border border-slate-100 bg-slate-50 text-slate-400 rounded-lg text-body-md cursor-not-allowed" disabled="">
<option>09:00</option>
</select>
</div>
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant">每日結束時間</label>
<select class="w-full px-4 py-2.5 border border-slate-100 bg-slate-50 text-slate-400 rounded-lg text-body-md cursor-not-allowed" disabled="">
<option>21:00</option>
</select>
</div>
</div>
<!-- Store Selector -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant">門店 <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-body-md appearance-none focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
<option>沐茉珐複合式國際美妍館</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Staff Selector -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant">工作人員</label>
<div class="relative">
<select class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-body-md appearance-none focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
<option>不限工作人員</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Remarks -->
<div class="space-y-1.5">
<label class="text-label-md font-label-md text-on-surface-variant">備註</label>
<textarea class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none resize-none" placeholder="請輸入備註內容..." rows="3"></textarea>
</div>
</div>
<!-- Modal Footer -->
<div class="p-6 border-t border-slate-100 flex justify-end gap-4">
<button class="px-8 py-2.5 border-2 border-secondary-container text-secondary font-bold rounded-lg hover:bg-secondary-container/10 transition-colors">取消</button>
<button class="px-8 py-2.5 bg-slate-200 text-slate-500 font-bold rounded-lg cursor-not-allowed" disabled="">儲存</button>
</div>
</div>
</div>
</body></html>
