<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#fff8f8",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#300247",
                    "outline-variant": "#dac0c9",
                    "surface-container-low": "#fff0f4",
                    "on-tertiary-fixed": "#042100",
                    "inverse-primary": "#ffafd3",
                    "on-tertiary-fixed-variant": "#145200",
                    "tertiary-container": "#328517",
                    "background": "#fff8f8",
                    "tertiary-fixed-dim": "#84db64",
                    "primary-fixed-dim": "#ffafd3",
                    "on-surface": "#23191d",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-variant": "#f1dee3",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#e8b3fe",
                    "secondary-fixed": "#f6d9ff",
                    "on-surface-variant": "#554149",
                    "inverse-surface": "#392d32",
                    "inverse-on-surface": "#ffecf1",
                    "primary-container": "#c14689",
                    "surface-container-high": "#f7e3e9",
                    "on-error": "#ffffff",
                    "primary-fixed": "#ffd8e7",
                    "on-secondary": "#ffffff",
                    "surface-tint": "#a52f72",
                    "outline": "#88717a",
                    "surface-dim": "#e8d5db",
                    "on-primary-fixed": "#3d0025",
                    "tertiary": "#1c6b00",
                    "on-background": "#23191d",
                    "tertiary-fixed": "#9ff87d",
                    "on-tertiary-container": "#f8ffee",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fff8f8",
                    "primary": "#a22c70",
                    "secondary": "#794c8f",
                    "secondary-container": "#e8b3fe",
                    "surface-container-highest": "#f1dee3",
                    "on-primary-fixed-variant": "#861259",
                    "on-secondary-fixed-variant": "#603475",
                    "on-secondary-container": "#6c4082",
                    "on-error-container": "#93000a",
                    "surface-container": "#fde9ef",
                    "on-primary-container": "#fffbff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "unit": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "gutter": "20px",
                    "sm": "8px",
                    "xs": "4px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "body-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Plus Jakarta Sans"],
                    "caption": ["Plus Jakarta Sans"],
                    "h2": ["Plus Jakarta Sans"],
                    "h1": ["Plus Jakarta Sans"],
                    "h3": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "h2": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "h1": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.6);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #c84c8f !important;
            box-shadow: 0 0 0 2px rgba(200, 76, 143, 0.1);
        }
    </style>
</head>
<body class="bg-surface-bright min-h-screen">
<!-- Background Shell Mockup (Underlay) -->
<div class="flex h-screen overflow-hidden opacity-40 grayscale">
<!-- Sidebar Shell -->
<aside class="fixed left-0 top-0 h-screen w-64 border-r border-gray-100 bg-white flex flex-col p-4 space-y-2">
<div class="flex items-center space-x-3 px-2 py-4 mb-6">
<div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center text-white">
<span class="material-symbols-outlined">auto_awesome</span>
</div>
<div>
<h1 class="font-black text-lg text-gray-900">Wonder sky</h1>
<p class="text-xs text-gray-500">國際美妍館</p>
</div>
</div>
<nav class="space-y-1">
<div class="flex items-center space-x-3 px-3 py-2 text-gray-600">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-sm font-medium">資訊中心</span>
</div>
<div class="flex items-center space-x-3 px-3 py-2 text-gray-600">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-sm font-medium">預約管理</span>
</div>
</nav>
</aside>
<!-- Main Content Shell -->
<main class="ml-64 flex-1 overflow-auto bg-surface">
<header class="bg-white/80 backdrop-blur-md px-6 py-3 border-b border-gray-100 flex justify-between items-center">
<span class="font-bold text-xl tracking-tight text-[#c84c8f]">Wonder sky 國際美妍館</span>
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined text-gray-400">notifications</span>
<div class="w-8 h-8 rounded-full bg-gray-200"></div>
</div>
</header>
<div class="p-lg">
<div class="grid grid-cols-12 gap-gutter">
<div class="col-span-12 h-64 bg-white rounded-xl shadow-sm border border-gray-100 p-lg">
<div class="h-4 w-48 bg-gray-100 rounded mb-4"></div>
<div class="h-32 w-full bg-gray-50 rounded"></div>
</div>
</div>
</div>
</main>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
<!-- Modal Content Container -->
<div class="bg-white w-full max-w-xl rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.2)] overflow-hidden flex flex-col">
<!-- Modal Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-gray-50">
<div class="w-10"></div> <!-- Spacer for centering -->
<h2 class="text-h2 font-h2 text-on-surface">設定臨時營業時間</h2>
<button class="w-10 h-10 flex items-center justify-center text-[#c84c8f] hover:bg-pink-50 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg space-y-lg overflow-y-auto max-h-[768px]">
<!-- Reminder text -->
<div class="text-center px-4">
<p class="text-body-md font-body-md text-[#c84c8f]">
                        *每日每家店只能設定一個臨時營業時間或臨時停止營業時間，新設定的時間會取代原先設定的時間*
                    </p>
</div>
<!-- Form Controls -->
<div class="space-y-xl">
<!-- Multi-date Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container rounded-lg">
<div>
<span class="text-body-md font-h3 text-on-surface block">選擇多個單一日期</span>
<span class="text-caption font-caption text-on-surface-variant block mt-1">開啟後可一次選取多個不連續日期</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#c84c8f]"></div>
</label>
</div>
<!-- Date Range Picker -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant">日期區間</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-[#c84c8f] transition-colors">calendar_today</span>
<input class="w-full pl-11 pr-4 py-3 bg-white border border-gray-100 rounded-lg text-body-md font-body-md text-on-surface cursor-pointer" readonly="" type="text" value="2026-03-05 ~ 2026-03-05"/>
</div>
</div>
<!-- Daily Times -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant">每日開始時間</label>
<div class="relative">
<select class="w-full pl-3 pr-10 py-3 bg-white border border-gray-100 rounded-lg text-body-md font-body-md text-on-surface appearance-none">
<option>09:00</option>
<option>10:00</option>
<option>11:00</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant">每日結束時間</label>
<div class="relative">
<select class="w-full pl-3 pr-10 py-3 bg-white border border-gray-100 rounded-lg text-body-md font-body-md text-on-surface appearance-none">
<option>20:00</option>
<option>21:00</option>
<option>22:00</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Store Selection -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant">套用門店</label>
<div class="relative">
<select class="w-full pl-3 pr-10 py-3 bg-white border border-gray-100 rounded-lg text-body-md font-body-md text-on-surface appearance-none">
<option>台北總店</option>
<option>台中旗艦店</option>
<option>高雄分店</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">storefront</span>
</div>
</div>
<!-- Remarks -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant">備註</label>
<textarea class="w-full p-3 bg-white border border-gray-100 rounded-lg text-body-md font-body-md text-on-surface resize-none" placeholder="例如：店內例行維護、員工教育培訓..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="p-lg border-t border-gray-50 flex items-center justify-center space-x-gutter">
<button class="px-xl py-3 rounded-full border border-secondary text-secondary font-semibold text-body-lg hover:bg-secondary-container/10 transition-colors active:scale-95 duration-200">
                    取消
                </button>
<button class="px-xl py-3 rounded-full bg-gray-200 text-gray-400 font-semibold text-body-lg cursor-not-allowed transition-all duration-200" disabled="">
                    儲存
                </button>
</div>
</div>
</div>
<!-- Background decorative image for visual richness (hidden behind modal) -->
<div class="fixed top-0 right-0 -z-10 opacity-5">
<img class="w-[600px]" data-alt="A clean, minimalist high-end spa reception desk area with soft, natural lighting. The scene features polished white surfaces, a touch of pink orchid flowers, and a serene, professional atmosphere. The lighting is bright and even, reinforcing a premium beauty service environment with a corporate yet gentle aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAl3DtcglGHqLK46KoikSvnL-2mevRT65ciTEwgbSxDXSpX0CffdETCbQB0rWXcySwIxTm_UFuW_Z5wxhTkiHcD0SBkX7tJjnbMot-w9ba-mYD3KgHfCqc0dLSvvnOlZQsc4Tcc9CloUyE0yBmi9EiFbtPnAqya2KPhMEFC_t-RyajVWC33jGMNqq33RA6h7sS8Cob--1Pkr3vq-HTz4LZm67f2Gj4AShNJIUIzdxBYY97u5EWd6JSLXo7MV6STN-yVf1bUgop0dTk"/>
</div>
</body></html>
