<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

            "on-error-container": "#93000a",
            "primary-fixed-dim": "#ffafd3",
            "surface-container-highest": "#f1dee3",
            "on-tertiary-fixed": "#042100",

            "on-tertiary": "#ffffff",

          "spacing": {
            "xl": "32px",
            "gutter": "20px",
            "container-padding": "24px",
            "xs": "4px",
            "md": "16px",
            "sm": "8px",
            "lg": "24px",
            "unit": "4px"
          },
          "fontSize": {
            "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
            "h1": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "h2": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
            "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]

      },

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-white/90 dark:bg-neutral-900/90 shadow-sm border-b border-gray-100 dark:border-neutral-800 flex justify-between items-center w-full px-4 py-3 docked full-width top-0 sticky z-40 transition-all duration-200 active:opacity-70">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-500" data-icon="menu">menu</span>
<h1 class="text-lg font-extrabold text-[#c84c8f] tracking-tighter font-['Plus_Jakarta_Sans']">Wonder Sky</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-primary-fixed-dim">
<img alt="Admin Profile" class="w-full h-full object-cover" data-alt="A clean and professional circular user avatar icon with a minimalist person silhouette. The background is a soft pink gradient representing a high-end beauty industry administrator profile. The lighting is bright and even, fitting the corporate light-mode UI style of Wonder Sky International Beauty Salon." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3PxguY23O1bMHxUmS0W0ALM-n7qawoptW74zDei3mb4uiQJygrK8FApMn-0aid5Nqim7NLJRRg81TYNgdX_3a47-Ot193WSr_GWNmiHI03oZTs4FZ-pL3zS6pVNZ-x44oFBYx9Ud0ebq3Oa00LEivOSgC7EM6ePVeq2BjRoaRHgLqM4IpXnyVrWYZ715z7xnd8SB43v8TcWTlF1merdkCK8KL3r5v1rM1LIdhhj3_8bb2hdnB4_bV2ZTwJ4DZVratn53MT7qTVVU"/>
</div>
</header>
<!-- Main Canvas (Background Content) -->
<main class="flex-grow p-container-padding pb-32">
<div class="grid grid-cols-1 gap-gutter">
<div class="bg-surface-container-lowest border border-gray-100 rounded-xl p-6 shadow-sm">
<h2 class="text-h2 text-[#a22c70] mb-4 font-h2">人員排班管理</h2>
<div class="aspect-video w-full rounded-lg bg-surface-container overflow-hidden relative">
<img class="w-full h-full object-cover opacity-80" data-alt="A modern, high-end medical spa or beauty salon reception area with minimalist furniture and soft rose-pink lighting. The atmosphere is professional, clean, and luxurious, featuring white marble accents and warm ambient lights that evoke a sense of trust and wellness for a B2B SaaS platform environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1afzZPAedP5DF9z0Jw5TmZuiImMpyqwOhXSAHD6whcKUxXX8EsaNp39_jWLe55FWaQmxevfhdNX8casI_nveEVq2B3TCBfZGXPFEthYUnmlaOZxJRpYuQkjLxq1GCrz0Bk-sfPIVTE6Yqx-I9cMrxGdgE8pm-AQjPewUVA5tME6w3d75lQTtVctqnpk-r3KjPYCxE7iixWMbWY8szL1gDleFAWVnkM94J52WrV7VSjcgMtr4nNNNvUaubiW0WP9buEHm4uAxLSas"/>
</div>
</div>
</div>
</main>
<!-- Bottom Sheet Overlay (Mask) -->
<div class="fixed inset-0 bg-black/60 z-50 backdrop-blur-[2px] transition-opacity">
<!-- Bottom Sheet Content -->
<div class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-2xl max-h-[795px] overflow-y-auto flex flex-col">
<!-- Drag Indicator -->
<div class="flex justify-center py-2">
<div class="w-12 h-1.5 bg-gray-200 rounded-full"></div>
</div>
<!-- Header -->
<div class="px-6 py-4 flex justify-between items-center border-b border-gray-50">
<h3 class="text-h2 font-h2 text-on-surface">設定臨時上班時間</h3>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-pink-50 transition-colors">
<span class="material-symbols-outlined text-[#c84c8f] !text-3xl font-bold" data-icon="close">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-6 py-4 space-y-5 flex-grow pb-28">
<!-- Tip Box -->
<div class="bg-pink-50/50 p-3 rounded-lg border border-pink-100/50">
<p class="text-[#c84c8f] text-caption leading-relaxed font-label-md">
            *每位工作人員每日只能設定一個臨時上班時間，若已存在設定，新的設定將會覆蓋舊有資料。
          </p>
</div>
<!-- Toggle Row -->
<div class="flex items-center justify-between py-2 min-h-[44px]">
<div>
<p class="text-body-md font-h3">選擇多個單一日期</p>
<p class="text-caption text-gray-500">可跨天非連續選擇</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#c84c8f]"></div>
</label>
</div>
<!-- Date Picker -->
<div class="space-y-1.5">
<label class="text-label-md text-on-surface-variant flex items-center gap-1">
            日期區間
          </label>
<div class="relative flex items-center">
<input class="w-full h-[44px] px-4 pl-11 bg-white border border-gray-200 rounded-lg text-body-md focus:ring-1 focus:ring-[#c84c8f] focus:border-[#c84c8f] outline-none" readonly="" type="text" value="2023-11-20 - 2023-11-22"/>
<span class="material-symbols-outlined absolute left-3 text-gray-400" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Time Controls -->
<div class="grid grid-cols-1 gap-4">
<div class="space-y-1.5">
<label class="text-label-md text-on-surface-variant">每日開始時間</label>
<div class="relative">
<select class="w-full h-[44px] px-4 bg-white border border-gray-200 rounded-lg text-body-md appearance-none focus:ring-1 focus:ring-[#c84c8f] outline-none">
<option>09:00</option>
<option selected="">10:00</option>
<option>11:00</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-1.5">
<label class="text-label-md text-on-surface-variant">每日結束時間</label>
<div class="relative">
<select class="w-full h-[44px] px-4 bg-white border border-gray-200 rounded-lg text-body-md appearance-none focus:ring-1 focus:ring-[#c84c8f] outline-none">
<option>18:00</option>
<option>19:00</option>
<option selected="">20:00</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Store Select -->
<div class="space-y-1.5">
<label class="text-label-md text-on-surface-variant">
            門店 <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<select class="w-full h-[44px] px-4 bg-white border border-[#c84c8f] rounded-lg text-body-md appearance-none focus:ring-1 focus:ring-[#c84c8f] outline-none">
<option selected="">沐茉珐複合式國際美妍館</option>
<option>旗艦中心總店</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-[#c84c8f] pointer-events-none" data-icon="store">store</span>
</div>
</div>
<!-- Staff Select -->
<div class="space-y-1.5">
<label class="text-label-md text-on-surface-variant">工作人員</label>
<div class="relative">
<select class="w-full h-[44px] px-4 bg-white border border-gray-200 rounded-lg text-body-md appearance-none focus:ring-1 focus:ring-[#c84c8f] outline-none">
<option selected="">請選擇工作人員</option>
<option>王曉美 (資深美容師)</option>
<option>李大華 (技術總監)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" data-icon="person_search">person_search</span>
</div>
</div>
<!-- Remarks -->
<div class="space-y-1.5">
<label class="text-label-md text-on-surface-variant">備註</label>
<textarea class="w-full min-h-[100px] p-4 bg-white border border-gray-200 rounded-lg text-body-md focus:ring-1 focus:ring-[#c84c8f] focus:border-[#c84c8f] outline-none resize-none" placeholder="請輸入備註內容..."></textarea>
</div>
</div>
<!-- Action Footer -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-50 flex gap-4">
<button class="flex-1 h-12 rounded-lg border border-gray-200 text-gray-600 font-semibold text-body-lg active:scale-95 transition-transform">
          取消
        </button>
<button class="flex-1 h-12 rounded-lg bg-[#c84c8f] text-white font-semibold text-body-lg shadow-lg shadow-pink-200 active:scale-95 transition-transform">
          儲存
        </button>
</div>
</div>
</div>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full z-40 bg-white/95 dark:bg-neutral-900/95 border-t border-gray-100 dark:border-neutral-800 shadow-[0_-4px_12px_rgba(0,0,0,0.04)] flex justify-around items-center px-4 pb-6 pt-2 rounded-t-2xl">
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-neutral-500 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]" data-icon="dashboard">dashboard</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">儀表板</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-neutral-500 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]" data-icon="calendar_today">calendar_today</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">預約</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-neutral-500 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]" data-icon="groups">groups</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">顧客</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c84c8f] bg-pink-50/50 dark:bg-pink-900/20 rounded-xl px-3 py-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]" data-icon="settings">settings</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium font-bold">設定</span>
</div>
</nav>
</body></html>
