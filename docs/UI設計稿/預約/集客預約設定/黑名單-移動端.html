<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-4 h-14 bg-white border-b border-slate-100 shadow-sm">
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-slate-500 hover:opacity-80 transition-opacity touch-manipulation active:scale-95" data-icon="menu">menu</button>
<h1 class="text-lg font-bold text-slate-800 font-h1">Wonder sky 國際美妍館</h1>
</div>
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-slate-500 hover:opacity-80 transition-opacity touch-manipulation active:scale-95" data-icon="notifications">notifications</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-primary-fixed">
<img alt="Profile" class="w-full h-full object-cover" data-alt="A professional high-resolution profile avatar of a sophisticated female salon manager. She is set against a soft-focus background of a modern luxury beauty clinic with warm ambient lighting. The visual style is polished and high-end, reflecting a premium SaaS enterprise environment with subtle tones of pink and white." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqWtsPeSiKBDAhHMab-vqoh2v5lF4AZttjwn3GVuaz5AhyxphQwoV4POKdB1ozX6pxZoKm5HWfbK9tn_OzAodDfU-1X0h1ME_E6xlm72BQ9QGi2R-8AQ1g4iIOAYhhqAv15bLp89fH3Oy5nvTeeyIv5HZJRjOygDCRv-YMnTU6iuerEeJv0K2fFAwiL9P9LUqvGbO9aoN24tczmQBhlVBCp1QWfA3-V4UE7R4ZyCIpRr9aecLvlkxNU_TrMR_GVxQV8vLiSBIOXcM"/>
</div>
</div>
</header>
<!-- Main Content -->
<main class="mt-14 p-4 max-w-md mx-auto">
<!-- Breadcrumb -->
<nav class="flex items-center gap-2 mb-6 text-caption text-outline">
<span>預約</span>
<span class="material-symbols-outlined text-[14px]">chevron_right</span>
<span>集客預約設定</span>
<span class="material-symbols-outlined text-[14px]">chevron_right</span>
<span class="text-primary font-bold">黑名單</span>
</nav>
<section class="space-y-4">
<!-- Blacklist Mechanism Toggle Card -->
<div class="bg-white rounded-xl p-lg border border-outline-variant shadow-[0_4px_12px_rgba(0,0,0,0.04)]">
<div class="flex items-center justify-between">
<div>
<h2 class="font-h2 text-h2 text-on-surface">黑名單機制</h2>
<p class="text-caption text-outline mt-1">開啟後系統將自動偵測並停權違規客戶</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-12 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
<!-- Configuration Form Card -->
<div class="bg-white rounded-xl p-lg border border-outline-variant shadow-[0_4px_12px_rgba(0,0,0,0.04)] space-y-6">
<!-- Time Range -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">history</span>
                        在時間範圍
                    </label>
<div class="relative">
<select class="w-full h-12 px-4 bg-surface appearance-none border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary text-body-md">
<option>1個月</option>
<option selected="">3個月</option>
<option>6個月</option>
<option>12個月</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Cancellation Threshold -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">event_busy</span>
                        取消已確認預約超過
                    </label>
<div class="relative">
<select class="w-full h-12 px-4 bg-surface appearance-none border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary text-body-md">
<option>3次</option>
<option selected="">5次</option>
<option>10次</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Suspension Duration -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">timer_off</span>
                        將停權客人
                    </label>
<div class="relative">
<select class="w-full h-12 px-4 bg-surface appearance-none border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary text-body-md">
<option>1個月</option>
<option selected="">3個月</option>
<option>6個月</option>
<option>永久</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Display Text -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">chat_bubble_outline</span>
                        黑名單會員進入預約的顯示文字
                    </label>
<textarea class="w-full p-4 bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary text-body-md min-h-[100px] resize-none" placeholder="未填寫以『您目前無法預約』顯示"></textarea>
<div class="flex justify-end text-caption text-outline">0 / 256</div>
</div>
</div>
<!-- Collapsible Preview Area -->
<div class="bg-white rounded-xl border border-outline-variant shadow-[0_4px_12px_rgba(0,0,0,0.04)] overflow-hidden">
<button class="w-full p-4 flex items-center justify-between text-on-surface-variant font-bold hover:bg-slate-50 transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">visibility</span>

<span class="material-symbols-outlined">expand_less</span>
</button>

<div class="h-6 w-full bg-slate-800 flex justify-center items-end pb-1">
<div class="w-16 h-3 bg-black rounded-full"></div>
</div>

<div class="w-12 h-12 bg-error-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
<div class="text-center space-y-2">
<h4 class="font-bold text-sm text-on-surface">預約提醒</h4>
<p class="text-xs text-outline leading-relaxed px-4">
                                    您目前無法預約，如有疑問請聯繫本店客服。
                                </p>
</div>
<div class="pt-4">
<div class="h-8 w-full bg-slate-100 rounded-lg flex items-center px-3">
<div class="h-2 w-1/2 bg-slate-200 rounded"></div>
</div>
<div class="h-24 w-full mt-2 bg-slate-50 border border-dashed border-slate-200 rounded-lg"></div>
</div>
</div>
</div>
<p class="text-caption text-center mt-4 text-outline-variant italic">此畫面為黑名單會員嘗試開啟預約頁面之模擬圖</p>
</div>
</div>
</section>
</main>

</a>
<a class="flex flex-col items-center justify-center text-slate-400 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</a>

<button class="w-full h-12 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
