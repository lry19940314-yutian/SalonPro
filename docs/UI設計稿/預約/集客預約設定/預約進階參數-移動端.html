        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-neutral-900 border-b border-neutral-100 shadow-sm flex justify-between items-center px-4 h-14">
<div class="flex items-center gap-3">
<button class="active:scale-95 transition-transform text-[#c84c8f]">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-lg font-bold text-[#c84c8f] tracking-tight font-['Plus_Jakarta_Sans']">Wonder Sky</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-neutral-500">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-primary-fixed">
<img alt="Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a beauty salon manager with a friendly smile, set against a soft, clean studio background with warm, rose-tinted lighting. The aesthetic is modern and high-end, reflecting the professional and trustworthy brand identity of Wonder Sky. The lighting is balanced and creates a polished, corporate look consistent with a high-end SaaS platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrW_kxkeUeFySAgmj2jA-wNwA2msaY_psSrGWvtHid-80jSKKkj-P3CMXekBTltnILmmT2TZCeVuIfkgpLyIHoO9wYlCW_DGkew1CxBIsKGuBdweSnV08Lek-YS_ArYDJE8GWoF3J8s1n9u8ZAyky-lg0lwNrOsLf8VwKtE0G_Sulr_I8uPg_QcX-t0AOzmuGJuEeo98vxKfuaCAdOAuPzOpZx3xbdZp_T-oqYbEY36r4Bl8RhJAwD62Qtq9YJHjLElZieRasxft4"/>
</div>
</div>
</header>
<main class="pt-20 pb-24 px-4 max-w-md mx-auto space-y-6">
<!-- Path Navigation -->
<nav class="flex items-center gap-1 overflow-x-auto whitespace-nowrap text-on-surface-variant py-2">
<span class="font-label-md text-label-md">預約</span>
<span class="material-symbols-outlined text-[16px]" data-icon="chevron_right">chevron_right</span>
<span class="font-label-md text-label-md">集客預約設定</span>
<span class="material-symbols-outlined text-[16px]" data-icon="chevron_right">chevron_right</span>
<span class="font-label-md text-label-md text-primary font-bold">預約進階設定</span>
</nav>
<!-- Main Settings Section -->
<section class="space-y-4">
<div class="bg-surface-container-lowest border border-outline-variant p-lg rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.04)] space-y-gutter">
<h2 class="font-h3 text-h3 text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="settings_suggest">settings_suggest</span>
                    預約進階參數
                </h2>
<!-- Appointment Time Interval -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block">預約時間間隔</label>
<div class="relative group">
<select class="w-full h-12 px-md appearance-none bg-surface border border-outline-variant rounded-lg text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary-container outline-none transition-all active:bg-surface-container-low">
<option value="15">15分鐘</option>
<option selected="" value="30">30分鐘</option>
<option value="60">60分鐘</option>
<option value="90">90分鐘</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Current Time Delay -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block">預約最晚需於當前時間前</label>
<div class="relative group">
<select class="w-full h-12 px-md appearance-none bg-surface border border-outline-variant rounded-lg text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary-container outline-none transition-all active:bg-surface-container-low">
<option value="0.5">30分鐘</option>
<option value="1">1小時</option>
<option selected="" value="2">2小時</option>
<option value="3">3小時</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<p class="font-caption text-caption text-primary flex items-center gap-1 px-1">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                        現在時間10:12，時間12:12前無法進行預約
                    </p>
</div>
<!-- Branch Delayed Closing Time -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block">分店延長預約收單時間</label>
<div class="relative group">
<select class="w-full h-12 px-md appearance-none bg-surface border border-outline-variant rounded-lg text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary-container outline-none transition-all active:bg-surface-container-low">
<option selected="" value="0">0分鐘</option>
<option value="30">30分鐘</option>
<option value="60">60分鐘</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<p class="font-caption text-caption text-outline px-1 leading-relaxed">
                        結束營業時間後，可額外進行預約的時間，此時間不會顯示於預約中。
                    </p>
</div>
</div>
</section>
<!-- Preview Section -->
<section>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.04)]">
<button class="w-full flex items-center justify-between px-lg py-md active:bg-surface-container transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="smartphone">smartphone</span>
<span class="font-h3 text-h3">手機預覽</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="expand_more">expand_more</span>
</button>
<div class="px-lg pb-lg">
<div class="aspect-[9/16] bg-surface-container-low rounded-lg border border-outline-variant overflow-hidden relative group">
<img alt="Appointment Preview" class="w-full h-full object-cover" data-alt="A detailed UI preview of a beauty salon member mobile app interface showing a clean appointment time selection screen. The design features a minimalist calendar grid, elegant time slots with soft pink highlights for selected times, and a refined white and rose gold color palette. The interface is displayed on a modern smartphone screen with soft studio lighting emphasizing its sleek, high-end professional aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoQMikF9dkAUcffG_r8gqMPJ_C_MXZLNo_5neBWzdRnj8RBNOgxohbsZnbZlQmN059_mpA7eJ0zj3t7IxsMizjPfvUek8PXD_OowI-QXQIya_jPM0eHzWHaJTo1Ymw-56ftmN2a5azW2XnnEp_x93-Y3LUQ4KbN-e0lDfyfBs7UXMXPwf3ClVkQSr_o5xlsE5tvfBh0BD8Xq_w3CFwKdxCuDk3jKLfKiVLbukM6Hxx990ekjzmhtHhT9W79-vK2TctDmQfn9NjdQU"/>
<div class="absolute inset-0 bg-black/5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="bg-white/90 px-md py-sm rounded-full text-primary font-bold text-sm shadow-sm">查看完整預覽</span>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-neutral-100 px-4 h-20 flex items-center justify-center z-50">
<button class="w-full max-w-md h-12 bg-[#c84c8f] text-white font-h2 text-h2 rounded-lg shadow-lg active:scale-95 active:bg-[#a22c70] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
            儲存設定
        </button>
</footer>
<!-- Bottom Navigation Bar (Hidden on this transactional page as per rules, but showing context) -->
<!-- Suppressed to prioritize the "Save Settings" focused task -->
</body></html>
