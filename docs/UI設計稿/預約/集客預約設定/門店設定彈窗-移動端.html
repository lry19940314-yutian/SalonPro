<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bottom-sheet-shadow {
            box-shadow: 0px -8px 24px rgba(0, 0, 0, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-slate-200 font-body-md overflow-hidden">
<!-- Background Content Mockup (Behind Mask) -->
<main class="min-h-screen p-4 flex flex-col gap-4 opacity-50 pointer-events-none">
<header class="flex items-center justify-between h-16 px-4 bg-white rounded-xl shadow-sm">
<span class="font-h2 text-primary">Wonder Sky</span>
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</header>
<div class="bg-white p-6 rounded-xl shadow-sm h-64">
<div class="h-4 w-1/3 bg-surface-variant rounded mb-4"></div>
<div class="h-32 bg-surface-container-low rounded-lg"></div>
</div>
</main>
<!-- Overlay Mask -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-[2px] z-40"></div>
<!-- Bottom Sheet Container -->
<div class="fixed inset-x-0 bottom-0 z-50 flex flex-col items-center">
<!-- Sheet Content -->
<div class="w-full max-w-md bg-surface-bright rounded-t-[32px] bottom-sheet-shadow pb-safe-offset-4 overflow-hidden flex flex-col">
<!-- Handle & Header -->
<div class="pt-3 pb-4 px-6 flex flex-col items-center relative">
<div class="w-12 h-1.5 bg-outline-variant/40 rounded-full mb-4"></div>
<h1 class="text-h2 text-on-surface font-h2">進階管理</h1>
<button class="absolute right-6 top-6 text-primary hover:bg-surface-container-high p-1 rounded-full transition-colors">
<span class="material-symbols-outlined !text-[28px]">close</span>
</button>
</div>
<!-- Tab Bar -->
<nav class="flex border-b border-surface-variant px-6">
<button class="flex-1 py-3 text-center font-label-md text-on-surface-variant relative">
                    品牌設定
                </button>
<button class="flex-1 py-3 text-center font-label-md text-primary relative">
                    門店設定
                    <div class="absolute bottom-0 left-1/4 right-1/4 h-1 bg-primary rounded-t-full"></div>
</button>
</nav>
<!-- Scrollable Content -->
<div class="px-6 py-6 flex flex-col gap-4">
<!-- Card 1: 工作人員排序 -->
<div class="w-full p-4 bg-surface-container-low rounded-2xl border border-primary-fixed-dim/30 flex items-center gap-4 transition-all active:scale-[0.98]">
<div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined !text-3xl" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="flex-1 flex flex-col gap-0.5">
<h3 class="text-body-lg font-h3 text-on-surface">工作人員排序</h3>
<p class="text-caption text-on-surface-variant">調整各門店工作人員在集客預約中的顯示順序</p>
</div>
<span class="material-symbols-outlined text-primary">chevron_right</span>
</div>
<!-- Card 2: 會員查詢功能排序 -->
<div class="w-full p-4 bg-surface-container-lowest rounded-2xl border border-outline-variant/30 flex items-center gap-4 transition-all active:scale-[0.98] shadow-sm">
<div class="w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined !text-3xl" style="font-variation-settings: 'FILL' 1;">sort_by_alpha</span>
</div>
<div class="flex-1 flex flex-col gap-0.5">
<h3 class="text-body-lg font-h3 text-on-surface">會員查詢功能排序</h3>
<p class="text-caption text-on-surface-variant">調整會員查詢頁面功能按鈕的顯示順序</p>
</div>
<span class="material-symbols-outlined text-primary">chevron_right</span>
</div>
</div>
<!-- Bottom Action -->
<div class="px-6 pb-8 pt-2">
<button class="w-full py-4 bg-primary text-on-primary font-h3 rounded-2xl shadow-lg shadow-primary/20 active:bg-primary-container transition-colors">
                    關閉
                </button>
</div>
</div>
</div>
<!-- Background Visualization Area (Hidden under sheet) -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -z-10 w-full px-8 flex flex-col gap-6">
<div class="w-full aspect-video rounded-3xl overflow-hidden relative border border-white/20">
<img class="w-full h-full object-cover" data-alt="A luxurious, high-end beauty salon interior with minimalist marble surfaces and soft, ambient pink lighting. The scene captures a professional and serene environment for wellness and aesthetic treatments. Elegant gold accents and modern furniture complement the clean, sophisticated atmosphere of the Wonder Sky international beauty institute, evoking trust and premium quality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMVKgkPw0wzQYC4gKfGU2rAUWDk73od7wwfxlWZcNZXqAIxF-tim3esS0QI2HlcJsvfHjLWW3e09B0athfkk1UQtwR6Gm_FAba9N3yOLIwljzyjIoBAkHruYfWagOzgMDTlqpqYgO-85krm7yID4-QFLTEJOx73wEYxhaknTvnXzDlkfLpU9LxRbWQEYm2nOGnzaWIXdR_9QprfNLEyknjuk8eDpV--q_1_8TizcqI8k2PQhcQ8iEC41OYcalB9ZzFCfLEwl8FVYY"/>
</div>
</div>
