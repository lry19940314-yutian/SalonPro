<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-error": "#ffffff",

                    "on-secondary-fixed-variant": "#782c49",
                    "on-background": "#1b1c1c",
                    "tertiary-fixed": "#ffd9e2",
                    "outline-variant": "#debfc5",
                    "surface-container-high": "#e9e8e7",
                    "on-tertiary-fixed": "#330f1d",
                    "error": "#ba1a1a",
                    "surface-tint": "#af265c",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#ffb1c5",
                    "surface": "#fbf9f8",
                    "secondary-fixed-dim": "#ffb1c8",
                    "on-primary-fixed-variant": "#8e0245",
                    "on-tertiary-container": "#fffbff",
                    "on-primary-container": "#fffbff",
                    "surface-container": "#efeded",
                    "on-secondary-container": "#792c49",
                    "on-surface-variant": "#574146",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e4e2e2",
                    "on-tertiary-fixed-variant": "#653a48",
                    "surface-container-low": "#f5f3f3",
                    "surface-container-highest": "#e4e2e2",
                    "background": "#fbf9f8",
                    "on-secondary-fixed": "#3e001d",
                    "on-primary": "#ffffff",
                    "tertiary": "#7d4e5d",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#1b1c1c",
                    "error-container": "#ffdad6",
                    "primary": "#ac235a",
                    "inverse-surface": "#303031",
                    "outline": "#8b7076",
                    "primary-fixed": "#ffd9e1"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "sm": "8px",
                    "lg": "24px",
                    "gutter": "16px",
                    "xl": "40px",
                    "unit": "4px",
                    "container-margin": "20px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "body-md": ["Work Sans", "Noto Sans TC"],
                    "body-lg": ["Work Sans", "Noto Sans TC"],
                    "h2": ["Plus Jakarta Sans", "Noto Sans TC"],
                    "label-md": ["Work Sans", "Noto Sans TC"],
                    "h3": ["Plus Jakarta Sans", "Noto Sans TC"],
                    "cjk-override": ["Noto Sans TC"],
                    "body-sm": ["Work Sans", "Noto Sans TC"],
                    "h1": ["Plus Jakarta Sans", "Noto Sans TC"]
            },
            "fontSize": {

                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],

                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "h1": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- Hero Background Section -->
<div class="fixed inset-0 z-0">
<img alt="Salon Environment Background" class="w-full h-full object-cover" data-alt="A luxurious and minimalist professional hair salon interior featuring warm oak wood accents, large soft-lit mirrors, and sleek white furniture. The atmosphere is serene and high-end, illuminated by soft natural morning light streaming through large windows. The overall aesthetic is clean and modern, utilizing a soft pink and neutral beige color palette that evokes a sense of calm and professional beauty care." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARWgxPsCELFvsYDYSeRvSc-y28Bbd2I9cssRCb9VFhDxyfmpSzl3nGmglNmw2iAnuT4wT__cyYyLqHypnkw3MrI-LHdfeNTIswtQiMWGutpl_rO5C8ha3HPyQvQChxfaDOS6VZnWgSe-SZAuwAZVPYecVHDCA7EAsnDy1-5C8ao4YhPSey1I1gPCBfMPVDiusXJkspF2kGMbKRh5FtzWA2w1BCgZXGxqzzqmj2saKfzuCL0UlKFdpUbJY6SCUwjF7HKmsW7Uw4q1I"/>
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-on-surface/40"></div>
</div>
<!-- Main Content Wrapper -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-gutter py-xl">
<!-- Header / Logo Area -->
<div class="mb-lg text-center">
<h1 class="font-h1 text-h1 text-white tracking-tight mb-xs">SayDou神美</h1>
<p class="font-label-md text-label-md text-white/90 tracking-widest uppercase">www.saydou.com</p>
</div>
<!-- Login Card -->
<div class="w-full max-w-[480px] bg-glass rounded-xl shadow-2xl p-md md:p-xl border border-white/20">
<div class="text-center mb-xl">
<h2 class="font-h2 text-h2 text-primary mb-sm">歡迎回來</h2>
<p class="font-body-md text-on-surface-variant">以專業與溫暖管理您的沙龍</p>
</div>
<form class="space-y-md">
<!-- Customer Code Input -->
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant flex items-center gap-sm px-xs">
<span class="material-symbols-outlined text-[18px]">apartment</span>
                        客戶代碼
                    </label>
<div class="relative">
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md" placeholder="請輸入您的客戶代碼" type="text"/>
</div>
</div>
<!-- Account Input -->
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant flex items-center gap-sm px-xs">
<span class="material-symbols-outlined text-[18px]">person</span>
                        帳號
                    </label>
<div class="relative">
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md" placeholder="請輸入您的員工帳號" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant flex items-center gap-sm px-xs">
<span class="material-symbols-outlined text-[18px]">lock</span>
                        密碼
                    </label>
<div class="relative">
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-md pr-12 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md" placeholder="請輸入密碼" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember & Forgot Password -->
<div class="flex items-center justify-between px-xs py-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">記住此裝置</span>
</label>
<a class="font-body-sm text-primary font-semibold hover:underline" href="#">忘記密碼？</a>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-white rounded-full font-h3 text-h3 shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    登入
                </button>
</form>
<!-- Footer Link inside Card -->
<div class="mt-xl text-center">
<p class="font-body-sm text-on-surface-variant">
                    還沒有帳號嗎？ 
                    <a class="text-primary font-semibold hover:underline ml-xs" href="#">申請員工帳號</a>
</p>
</div>
</div>
</main>
<!-- Global Footer -->
<footer class="relative z-10 w-full py-lg px-gutter border-t border-white/10 bg-black/10 backdrop-blur-sm">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-md">
<div class="flex items-center gap-lg">
<a class="font-body-sm text-white/70 hover:text-white transition-colors" href="#">隱私權政策</a>
<a class="font-body-sm text-white/70 hover:text-white transition-colors" href="#">服務條款</a>
<a class="font-body-sm text-white/70 hover:text-white transition-colors" href="#">幫助中心</a>
</div>
<div class="text-center md:text-right">
<p class="font-label-md text-white/60 tracking-wider">© 2024 SayDou. All rights reserved.</p>
</div>
</div>
</footer>
</body></html>
