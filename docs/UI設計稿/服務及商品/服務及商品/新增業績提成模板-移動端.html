</div>

<span class="material-symbols-outlined text-xs">chevron_right</span>
<span>業績提成模板設定</span>

<h2 class="text-[#c84c8f] font-h2 text-h2">新增業績提成模板</h2>

</label>

<button class="bg-[#c84c8f] text-white rounded-xl px-8 py-2 shadow-lg shadow-[#c84c8f]/20 font-['Plus_Jakarta_Sans'] text-xs font-bold uppercase hover:opacity-90 transition-opacity active:scale-95 duration-200 min-h-[44px] flex items-center gap-2">
<span class="material-symbols-outlined text-base">check_circle</span>
