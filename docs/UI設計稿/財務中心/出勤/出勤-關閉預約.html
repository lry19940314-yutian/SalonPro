<!DOCTYPE html>

<body class="bg-surface font-body-md text-on-surface">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white dark:bg-gray-950 border-b border-gray-100 dark:border-gray-800 shadow-sm dark:shadow-none">
<div class="flex items-center gap-3">
<button class="p-2 hover:bg-gray-50 dark:hover:bg-gray-900 rounded-full text-pink-700 dark:text-pink-400">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-lg font-extrabold text-pink-700 dark:text-pink-400 tracking-tight font-['Plus_Jakarta_SANS']">BeautyAdmin</h1>
</div>
<div class="flex items-center gap-4">
<nav class="hidden md:flex gap-6 mr-6">
<a class="text-pink-700 dark:text-pink-400 font-bold font-['Plus_Jakarta_SANS'] text-body-md" href="#">Schedule</a>
<a class="text-gray-500 dark:text-gray-400 font-['Plus_Jakarta_SANS'] text-body-md hover:text-pink-600" href="#">Clients</a>
<a class="text-gray-500 dark:text-gray-400 font-['Plus_Jakarta_SANS'] text-body-md hover:text-pink-600" href="#">Sales</a>
</nav>
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden border border-outline-variant">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a female salon manager with a friendly smile, set against a softly blurred minimalist studio background. The lighting is bright and airy, reflecting a high-end beauty industry aesthetic. Her appearance is polished and sophisticated, echoing the corporate modern style of the Luminous Analytics brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB__fdKbaclTj1sDT1pM3x5pAa8OS-5Gn9Pqtt-dBM55WUCuodo3HbOi_ezhVrrYAjIO1wNJEChVNxRLbpyzPGsiSJqURqnHvh3FEB0Brtf4p3SaZm6DD7Z_aQP_Mxo1Mekuf0mmHfigXuj8Cl09qzSDP10CWbzOwUaw1uad2ugg6Gyskkt7Zc1Q3_zihHlQbtw9AvGjz2mEXqjQzAWCprDw9dSK7nj58-xr6KK_Ybs1YJE28GYu5Li409YpHl9sW8B-hDNKl914NI"/>
</div>
</div>
</header>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
<!-- Modal Content -->
<div class="bg-surface-container-lowest w-full max-w-[560px] rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.12)] border border-outline-variant overflow-hidden">
<!-- Modal Header -->
<div class="relative px-6 py-5 border-b border-outline-variant flex justify-center items-center">
<h2 class="font-h2 text-h2 text-on-surface">關閉預約</h2>
<button class="absolute right-4 top-1/2 -translate-y-1/2 p-2 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Form Body -->
<div class="px-8 py-6 space-y-6 max-h-[716px] overflow-y-auto">
<!-- Toggle: Select Multiple Dates -->
<div class="flex items-center justify-between">
<span class="font-body-md text-on-surface-variant">選擇多個單一日期</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Date Range Picker -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">日期區間</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">calendar_today</span>
</div>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md" placeholder="YYYY/MM/DD - YYYY/MM/DD" type="text"/>
</div>
</div>
<!-- Toggle: All Day -->
<div class="flex items-center justify-between">
<span class="font-body-md text-on-surface-variant">整日</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Time Dropdowns -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">每日開始時間</label>
<div class="relative">
<select class="w-full pl-4 pr-10 py-2.5 bg-surface-container-low border border-outline-variant rounded-lg appearance-none focus:border-primary outline-none text-body-md text-on-surface-variant" disabled="">
<option>09:00</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">每日結束時間</label>
<div class="relative">
<select class="w-full pl-4 pr-10 py-2.5 bg-surface-container-low border border-outline-variant rounded-lg appearance-none focus:border-primary outline-none text-body-md text-on-surface-variant" disabled="">
<option>21:00</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Store Dropdown -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant flex items-center">
                        門店 <span class="text-error ml-1">*</span>
</label>
<div class="relative">
<select class="w-full pl-4 pr-10 py-2.5 bg-white border border-outline-variant rounded-lg appearance-none focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-body-md">
<option value="">請選擇門店</option>
<option>忠孝旗艦店</option>
<option>中山南西店</option>
<option>信義新光店</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- Staff Dropdown -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant flex items-center">
                        工作人員 <span class="text-error ml-1">*</span>
</label>
<div class="relative">
<select class="w-full pl-4 pr-10 py-2.5 bg-white border border-outline-variant rounded-lg appearance-none focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-body-md">
<option value="">請選擇工作人員</option>
<option>所有員工</option>
<option>Alice (資深設計師)</option>
<option>Bella (美甲師)</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- Remarks Textarea -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">備註</label>
<textarea class="w-full px-4 py-2.5 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-body-md resize-none" placeholder="請輸入關閉預約的原因或備註..." rows="3"></textarea>
</div>
</div>
<!-- Modal Footer -->
<div class="px-8 py-5 border-t border-outline-variant bg-surface-container-low flex justify-end gap-3">
<button class="px-6 py-2.5 font-label-md text-on-surface-variant hover:bg-surface-container-high rounded-lg transition-colors">
                    取消
                </button>
<button class="px-8 py-2.5 font-label-md bg-primary text-on-primary rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all">
                    儲存
                </button>
</div>
</div>
</div>
<!-- Main Content Background (to show layout) -->
<main class="pt-24 px-6 max-w-7xl mx-auto space-y-8 opacity-40 select-none pointer-events-none">
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="bg-white p-6 rounded-xl border border-outline-variant shadow-sm h-48"></div>
<div class="bg-white p-6 rounded-xl border border-outline-variant shadow-sm h-48"></div>
<div class="bg-white p-6 rounded-xl border border-outline-variant shadow-sm h-48"></div>
</div>
<div class="bg-white p-8 rounded-xl border border-outline-variant shadow-sm h-96 w-full"></div>
</main>
<!-- BottomNavBar from JSON (Hidden on Desktop) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe bg-white/95 dark:bg-gray-950/95 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<div class="flex flex-col items-center justify-center bg-pink-50 dark:bg-pink-900/30 text-pink-700 dark:text-pink-300 rounded-2xl px-4 py-1.5 font-['Plus_Jakarta_SANS'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1">calendar_month</span>
<span>Schedule</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1.5 font-['Plus_Jakarta_SANS'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1">group</span>
<span>Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1.5 font-['Plus_Jakarta_SANS'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1">payments</span>
<span>Sales</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1.5 font-['Plus_Jakarta_SANS'] text-[11px] font-medium">
<span class="material-symbols-outlined mb-1">more_horiz</span>
<span>More</span>
</div>
</nav>
</body></html>
