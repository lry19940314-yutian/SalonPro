<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>員工出勤記錄 - Wonder Sky</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#84db64",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#554149",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#fff0f4",
                        "on-error": "#ffffff",
                        "on-background": "#23191d",
                        "on-tertiary-fixed-variant": "#145200",
                        "on-secondary-fixed": "#300247",
                        "on-secondary-fixed-variant": "#603475",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#f8ffee",
                        "on-secondary-container": "#6c4082",
                        "surface": "#fff8f8",
                        "secondary-container": "#e8b3fe",
                        "tertiary": "#1c6b00",
                        "surface-container": "#fde9ef",
                        "primary": "#a22c70",
                        "inverse-surface": "#392d32",
                        "primary-fixed-dim": "#ffafd3",
                        "background": "#fff8f8",
                        "primary-fixed": "#ffd8e7",
                        "on-surface": "#23191d",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fff8f8",
                        "inverse-primary": "#ffafd3",
                        "on-primary-fixed-variant": "#861259",
                        "surface-container-high": "#f7e3e9",
                        "primary-container": "#c14689",
                        "on-error-container": "#93000a",
                        "secondary": "#794c8f",
                        "on-primary-fixed": "#3d0025",
                        "on-primary-container": "#fffbff",
                        "surface-tint": "#a52f72",
                        "tertiary-container": "#328517",
                        "surface-container-highest": "#f1dee3",
                        "secondary-fixed": "#f6d9ff",
                        "inverse-on-surface": "#ffecf1",
                        "surface-variant": "#f1dee3",
                        "tertiary-fixed": "#9ff87d",
                        "secondary-fixed-dim": "#e8b3fe",
                        "outline": "#88717a",
                        "surface-dim": "#e8d5db",
                        "on-tertiary-fixed": "#042100",
                        "outline-variant": "#dac0c9",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "gutter": "20px",
                        "xl": "32px",
                        "container-padding": "24px"
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: "Plus Jakarta Sans", "Noto Sans TC", sans-serif;
        }
        .bottom-sheet-mask {
            background-color: rgba(20, 20, 20, 0.6);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface">
<!-- Screen Wrapper -->
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Mock Background (The screen behind the bottom sheet) -->
<div class="p-lg opacity-40">
<h1 class="text-h1 text-on-surface mb-md">財務中心</h1>
<div class="space-y-md">
<div class="h-20 bg-surface-container rounded-lg"></div>
<div class="h-20 bg-surface-container rounded-lg"></div>
<div class="h-20 bg-surface-container rounded-lg"></div>
</div>
</div>
<!-- Bottom Sheet Overlay -->
<div class="bottom-sheet-mask absolute inset-0 z-50 flex flex-col justify-end">
<!-- Bottom Sheet Content -->
<div class="bg-surface rounded-t-[28px] max-h-[813px] flex flex-col shadow-2xl">
<!-- Handle -->
<div class="flex h-unit*5 w-full items-center justify-center pt-md pb-xs">
<div class="h-1 w-9 rounded-full bg-outline-variant"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-lg py-sm border-b border-surface-container-highest">
<h2 class="text-h2 text-on-surface font-bold">出勤記錄 LULU</h2>
<button class="flex h-12 w-12 items-center justify-center rounded-full text-primary active:bg-primary/10">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
</div>
<!-- Scrollable Body -->
<div class="overflow-y-auto flex-1 p-lg space-y-lg pb-xl">
<!-- 數據概覽 (Data Overview Card List) -->
<section>
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-primary" data-icon="analytics">analytics</span>
<h3 class="text-h3 text-on-surface">數據概覽</h3>
</div>
<div class="space-y-sm">
<!-- Card Items -->
<div class="flex justify-between items-center p-md bg-white border border-outline-variant rounded-xl shadow-sm">
<span class="text-on-surface-variant font-medium">應出勤天數</span>
<span class="text-primary text-xl font-bold">22 <small class="text-sm font-normal text-on-surface-variant">天</small></span>
</div>
<div class="flex justify-between items-center p-md bg-white border border-outline-variant rounded-xl shadow-sm">
<span class="text-on-surface-variant font-medium">實際出勤</span>
<span class="text-primary text-xl font-bold">20 <small class="text-sm font-normal text-on-surface-variant">天</small></span>
</div>
<div class="flex justify-between items-center p-md bg-white border border-outline-variant rounded-xl shadow-sm">
<span class="text-on-surface-variant font-medium">遲到次數</span>
<span class="text-primary text-xl font-bold">2 <small class="text-sm font-normal text-on-surface-variant">次</small></span>
</div>
<div class="flex justify-between items-center p-md bg-white border border-outline-variant rounded-xl shadow-sm">
<span class="text-on-surface-variant font-medium">早退次數</span>
<span class="text-primary text-xl font-bold">1 <small class="text-sm font-normal text-on-surface-variant">次</small></span>
</div>
<div class="flex justify-between items-center p-md bg-white border border-outline-variant rounded-xl shadow-sm">
<span class="text-on-surface-variant font-medium">加班總時數</span>
<span class="text-primary text-xl font-bold">5.5 <small class="text-sm font-normal text-on-surface-variant">hr</small></span>
</div>
<div class="flex justify-between items-center p-md bg-white border border-outline-variant rounded-xl shadow-sm">
<span class="text-on-surface-variant font-medium">請假總時數</span>
<span class="text-primary text-xl font-bold">16 <small class="text-sm font-normal text-on-surface-variant">hr</small></span>
</div>
</div>
</section>
<!-- 明細記錄 (Detail Flow) -->
<section>
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-primary" data-icon="history">history</span>
<h3 class="text-h3 text-on-surface">明細記錄</h3>
</div>
<div class="space-y-md">
<!-- Detail Card 1 -->
<div class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="p-md flex justify-between items-start border-b border-surface-container">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="text-lg font-bold text-on-surface">2024/05/20</span>
<span class="px-2 py-0.5 rounded text-xs font-bold bg-tertiary-fixed text-on-tertiary-fixed-variant">正常出勤</span>
</div>
<p class="text-body-md text-on-surface-variant">09:00 - 18:00</p>
</div>
<button class="text-outline">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
<div class="px-md py-sm bg-surface-container-low flex justify-between items-center">
<span class="text-caption text-on-surface-variant italic">系統建立：05/20 08:58</span>
<button class="text-primary text-sm font-bold flex items-center gap-1">
                                        查看詳情 <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
</button>
</div>
</div>
<!-- Detail Card 2 -->
<div class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="p-md flex justify-between items-start border-b border-surface-container">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="text-lg font-bold text-on-surface">2024/05/19</span>
<span class="px-2 py-0.5 rounded text-xs font-bold bg-secondary-container text-on-secondary-container">事假</span>
</div>
<p class="text-body-md text-on-surface-variant">09:00 - 18:00 (全天)</p>
</div>
<button class="text-outline">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
<div class="px-md py-sm bg-surface-container-low flex justify-between items-center">
<span class="text-caption text-on-surface-variant italic">主管核可：05/18 15:30</span>
<button class="text-primary text-sm font-bold flex items-center gap-1">
                                        查看單據 <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
</button>
</div>
</div>
<!-- Detail Card 3 -->
<div class="bg-white border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="p-md flex justify-between items-start border-b border-surface-container">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="text-lg font-bold text-on-surface">2024/05/18</span>
<span class="px-2 py-0.5 rounded text-xs font-bold bg-error-container text-on-error-container">遲到 15m</span>
</div>
<p class="text-body-md text-on-surface-variant">09:15 - 18:05</p>
</div>
<button class="text-outline">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
<div class="px-md py-sm bg-surface-container-low flex justify-between items-center">
<span class="text-caption text-on-surface-variant italic">系統建立：05/18 09:15</span>
<button class="text-primary text-sm font-bold flex items-center gap-1">
                                        補簽申請 <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
</button>
</div>
</div>
</div>
</section>
</div>
<!-- Footer Action -->
<div class="p-lg border-t border-surface-container-highest bg-white flex flex-col gap-md">
<button class="w-full bg-primary text-white h-14 rounded-xl text-lg font-bold shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="file_download">file_download</span>
                        匯出本月出勤表
                    </button>
<button class="w-full text-primary border border-primary h-14 rounded-xl text-lg font-bold active:bg-primary/5">
                        關閉視窗
                    </button>
</div>
</div>
</div>
</div>
</body></html>
