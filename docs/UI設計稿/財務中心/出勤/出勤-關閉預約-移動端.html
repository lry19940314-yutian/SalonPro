<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bottom-sheet-shadow {
            box-shadow: 0 -8px 32px rgba(35, 25, 29, 0.08);
        }
        body {
            background-color: #f3f4f6; /* Simulator background */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-md text-on-surface">
<!-- Backdrop Simulator (Visual Context) -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-[2px] z-0"></div>
<!-- Main Content Area (Simulator for Mobile Viewport) -->
<div class="relative min-h-screen flex items-end justify-center z-10 px-0 sm:px-4">
<!-- Bottom Sheet Container -->
<div class="w-full max-w-md bg-white dark:bg-gray-950 rounded-t-xl bottom-sheet-shadow overflow-hidden flex flex-col max-h-[813px]">
<!-- Header Section -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant/30">
<div class="w-10"></div> <!-- Spacer for balance -->
<h1 class="font-h2 text-h2 text-on-surface">關閉預約</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-primary transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Scrollable Form Content -->
<div class="flex-1 overflow-y-auto px-lg py-lg space-y-lg">
<!-- Toggle: Select multiple single dates -->
<div class="flex items-center justify-between p-md bg-surface-container-low rounded-lg">
<label class="font-body-lg text-on-surface">選擇多個單一日期</label>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-gray-200" role="switch">
<span class="translate-x-0 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Input: Date Range -->
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
                        日期區間
                    </label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="calendar_month">calendar_month</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" readonly="" type="text" value="2023/11/01 - 2023/11/07"/>
</div>
</div>
<!-- Toggle: All Day -->
<div class="flex items-center justify-between p-md border border-primary/20 bg-primary/5 rounded-lg">
<label class="font-body-lg text-primary font-semibold">整日</label>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-primary" role="switch">
<span class="translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Time Selectors -->
<div class="grid grid-cols-1 gap-md opacity-50">
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant">每日開始時間</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 bg-gray-50 border border-outline-variant rounded-lg focus:border-primary outline-none cursor-not-allowed" disabled="">
<option>09:00</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant">每日結束時間</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 bg-gray-50 border border-outline-variant rounded-lg focus:border-primary outline-none cursor-not-allowed" disabled="">
<option>18:00</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
</div>
<!-- Required Dropdown: Store -->
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
                        門店 <span class="text-error">*</span>
</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none cursor-pointer">
<option value="">選擇門店</option>
<option value="1">忠孝旗艦店</option>
<option value="2">中山精品店</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="store">store</span>
</div>
</div>
<!-- Required Dropdown: Staff -->
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant flex items-center gap-1">
                        工作人員 <span class="text-error">*</span>
</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none cursor-pointer">
<option value="">選擇工作人員</option>
<option value="1">陳小美 (Kelly)</option>
<option value="2">林大明 (David)</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="person">person</span>
</div>
</div>
<!-- Textarea: Remarks -->
<div class="space-y-sm">
<label class="font-label-md text-on-surface-variant">備註</label>
<textarea class="w-full px-4 py-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="請輸入備註內容..." rows="3"></textarea>
</div>
<!-- Spacer for mobile keyboard accessibility -->
<div class="h-8"></div>
</div>
<!-- Footer Section -->
<div class="p-lg border-t border-outline-variant/30 flex gap-md bg-white">
<button class="flex-1 py-3.5 border-2 border-primary text-primary font-semibold rounded-lg active:bg-primary/10 transition-all">
                    取消
                </button>
<button class="flex-1 py-3.5 bg-primary text-white font-semibold rounded-lg shadow-md active:opacity-80 transition-all">
                    儲存
                </button>
</div>
<!-- Safe Area Bottom Spacer -->
<div class="h-safe bg-white"></div>
</div>
</div>
<!-- Top App Bar Content Reference from JSON (Hidden but implemented for brand consistency) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white border-b border-gray-100 shadow-sm hidden md:flex">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-pink-700" data-icon="menu">menu</span>

</div>
