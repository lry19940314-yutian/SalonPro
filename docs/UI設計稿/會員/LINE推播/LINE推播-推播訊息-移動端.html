<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#300247",
                        "background": "#fff8f8",
                        "secondary-fixed": "#f6d9ff",
                        "tertiary-fixed": "#9ff87d",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fff8f8",
                        "on-secondary-container": "#6c4082",
                        "inverse-surface": "#392d32",
                        "tertiary-fixed-dim": "#84db64",
                        "on-primary-fixed": "#3d0025",
                        "tertiary": "#1c6b00",
                        "primary-fixed-dim": "#ffafd3",
                        "outline": "#88717a",
                        "primary": "#a22c70",
                        "secondary-fixed-dim": "#e8b3fe",
                        "on-tertiary-fixed-variant": "#145200",
                        "on-tertiary-container": "#f8ffee",
                        "on-primary-fixed-variant": "#861259",
                        "inverse-on-surface": "#ffecf1",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#f1dee3",
                        "on-tertiary-fixed": "#042100",
                        "surface-dim": "#e8d5db",
                        "inverse-primary": "#ffafd3",
                        "on-primary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#fff0f4",
                        "surface-variant": "#f1dee3",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#a52f72",
                        "primary-container": "#c14689",
                        "surface": "#fff8f8",
                        "on-surface-variant": "#554149",
                        "surface-container-high": "#f7e3e9",
                        "on-error-container": "#93000a",
                        "on-background": "#23191d",
                        "secondary": "#794c8f",
                        "on-secondary-fixed-variant": "#603475",
                        "outline-variant": "#dac0c9",
                        "secondary-container": "#e8b3fe",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#23191d",
                        "on-error": "#ffffff",
                        "surface-container": "#fde9ef",
                        "primary-fixed": "#ffd8e7",
                        "tertiary-container": "#328517"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "gutter": "20px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "container-padding": "24px",
                        "xl": "32px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "h3": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "h2": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h1": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #a22c70 !important;
            box-shadow: 0 0 0 2px rgba(162, 44, 112, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-white dark:bg-gray-900 shadow-sm border-b border-gray-100 dark:border-gray-800 flex justify-between items-center px-4 h-16 w-full sticky top-0 z-50">
<div class="flex items-center gap-3">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined text-gray-600" data-icon="menu">menu</span>
</button>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-xl text-[#c84c8f]">Wonder Sky Salon</span>
</div>
<div class="flex items-center gap-2">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined text-gray-600" data-icon="notifications">notifications</span>
</button>
<div class="w-10 h-10 rounded-full border-2 border-[#c84c8f] overflow-hidden">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A professional close-up of a salon manager with a friendly smile, set in a bright, modern beauty salon with soft pink and white interior design elements. High-key lighting highlights the polished atmosphere." src="https://lh3.googleusercontent.com/aida/ADBb0uhEUJlFM2to0y5S6ihqdjVTyf_keGWyfBgwtW8-bhNzPqf29-Rxo3GY7uOxA8OZyO2yhnufowDFoxyMo8U_bwKvaXXSwNRO5dAaUpy8fW2_tivqlDurrUkqxi8u5D5eQIXLLdRTL42hL4-25em408dxWOMviG-anNuwG-zbROauIAdz83qusE0OKJbHZsZZ8HSThK_klvhD7K7_XZ9x8gR4aKiPMR6v30uXI1GID6k4Ck5OGneiohFCjT1AbBNDasXdEdveOr9K7w"/>
</div>
</div>
</header>
<!-- Content Canvas -->
<main class="max-w-md mx-auto px-4 py-4 space-y-6">
<!-- Breadcrumbs -->
<nav class="flex items-center gap-2 text-on-surface-variant font-label-md">
<span>會員</span>
<span class="material-symbols-outlined text-[16px]" data-icon="chevron_right">chevron_right</span>
<span class="text-primary font-bold">LINE推播</span>
</nav>
<!-- Tab Bar -->
<div class="flex items-center overflow-x-auto no-scrollbar border-b border-outline-variant">
<button class="px-4 py-3 text-primary border-b-2 border-primary font-bold whitespace-nowrap min-h-[44px]">推播訊息</button>
<button class="px-4 py-3 text-on-surface-variant hover:text-primary whitespace-nowrap min-h-[44px]">推播記錄</button>
<button class="px-4 py-3 text-on-surface-variant hover:text-primary whitespace-nowrap min-h-[44px]">草稿</button>
<button class="px-4 py-3 text-on-surface-variant hover:text-primary whitespace-nowrap min-h-[44px]">已排定時間</button>
</div>
<!-- Multi-Step Vertical Form -->
<div class="space-y-6">
<!-- Module 1: LINE Official Account -->
<section class="bg-white rounded-xl border border-outline-variant shadow-sm p-4 space-y-4">
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">1</span>
<h2 class="font-h2 text-on-surface">LINE官方帳號</h2>
</div>
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant">選擇門店</label>
<div class="relative">
<select class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface appearance-none text-on-surface font-body-md focus:ring-2 focus:ring-primary/20">
<option>沐茉珐複合式國際美妍館</option>
<option>二號旗艦店</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<a class="inline-flex items-center text-primary font-bold text-body-md hover:underline gap-1" href="#">
                    查詢官方帳號資訊
                    <span class="material-symbols-outlined text-[18px]" data-icon="open_in_new">open_in_new</span>
</a>
<button class="w-full h-12 bg-primary text-white font-bold rounded-lg hover:bg-primary/90 transition-all flex items-center justify-center">
                    下一步
                </button>
</section>
<!-- Module 2: Filtering Settings -->
<section class="bg-white rounded-xl border border-outline-variant shadow-sm p-4 space-y-4">
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center font-bold">2</span>
<h2 class="font-h2 text-on-surface">篩選設定</h2>
</div>
<div class="space-y-3">
<!-- Radio Card 1 -->
<label class="flex items-center p-4 border-2 border-primary bg-primary/5 rounded-xl gap-4 cursor-pointer">
<input checked="" class="w-5 h-5 text-primary border-primary focus:ring-primary" name="target" type="radio"/>
<div class="flex-1">
<p class="font-h3 text-primary">所有會員</p>
<p class="text-caption text-on-surface-variant">發送給所有已連動LINE的會員</p>
</div>
<span class="material-symbols-outlined text-primary" data-icon="groups">groups</span>
</label>
<!-- Radio Card 2 -->
<label class="flex items-center p-4 border border-outline-variant rounded-xl gap-4 cursor-pointer hover:bg-surface-container">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="target" type="radio"/>
<div class="flex-1">
<p class="font-h3 text-on-surface">篩選會員</p>
<p class="text-caption text-on-surface-variant">依照消費習慣、標籤進行精準推播</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="filter_list">filter_list</span>
</label>
<!-- Radio Card 3 -->
<label class="flex items-center p-4 border border-outline-variant rounded-xl gap-4 cursor-pointer hover:bg-surface-container">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="target" type="radio"/>
<div class="flex-1">
<p class="font-h3 text-on-surface">直接選擇會員</p>
<p class="text-caption text-on-surface-variant">手動挑選特定的發送對象</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person_add">person_add</span>
</label>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg">
<div class="flex flex-col">
<span class="font-label-md text-on-surface">不傳送封鎖名單</span>
<span class="text-caption text-on-surface-variant">自動剔除已封鎖官方帳號的用戶</span>
</div>
<div class="relative inline-flex h-6 w-11 items-center rounded-full bg-primary/30 cursor-pointer">
<span class="translate-x-6 inline-block h-4 w-4 transform rounded-full bg-primary transition"></span>
</div>
</div>
</section>
<!-- Module 3: Push Content -->
<section class="bg-white rounded-xl border border-outline-variant shadow-sm p-4 space-y-4">
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center font-bold">3</span>
<h2 class="font-h2 text-on-surface">推播內容</h2>
</div>
<div class="space-y-4">
<div class="space-y-1">
<label class="font-label-md text-on-surface flex items-center">
                            訊息主旨 <span class="text-error ml-1">*</span>
</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface font-body-md" placeholder="請輸入訊息主旨，僅供內部辨識" type="text"/>
</div>
<button class="w-full py-2 border-2 border-dashed border-primary text-primary font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
                        新增訊息
                    </button>
<!-- Message Type Selector -->
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
<button class="px-4 py-1.5 bg-primary text-white rounded-full whitespace-nowrap text-caption font-bold">文字</button>
<button class="px-4 py-1.5 bg-surface-container-highest text-on-surface-variant rounded-full whitespace-nowrap text-caption font-bold">圖片</button>
<button class="px-4 py-1.5 bg-surface-container-highest text-on-surface-variant rounded-full whitespace-nowrap text-caption font-bold">圖文選單</button>
<button class="px-4 py-1.5 bg-surface-container-highest text-on-surface-variant rounded-full whitespace-nowrap text-caption font-bold">影片</button>
<button class="px-4 py-1.5 bg-surface-container-highest text-on-surface-variant rounded-full whitespace-nowrap text-caption font-bold">音訊</button>
</div>
<div class="relative space-y-1">
<textarea class="w-full p-4 rounded-xl border border-outline-variant bg-surface font-body-md resize-none" placeholder="請輸入訊息內容..." rows="6"></textarea>
<div class="absolute bottom-3 right-3 text-caption text-on-surface-variant">0/500字</div>
</div>
<div class="rounded-xl overflow-hidden shadow-sm border border-outline-variant">
<img alt="Preview Image" class="w-full aspect-[2.18] object-cover" data-alt="A clean, minimalist preview of a salon marketing graphic featuring soft floral patterns and elegant typography in white and pink. The image is bright and professional, designed for a high-end beauty brand's mobile messaging interface." src="https://lh3.googleusercontent.com/aida/ADBb0uguC-XEt0dGj9A5JY9s4BJYkfLEBjPKJUCXeNlaTVq7S3GnrOJvULE4L2qus8FRjGHHAg5H2CiCS1S9QZERLVeZdl4QNNlzJ0G3a6k2ndOr8pnOTir6RmgMPPl0wDZpU2dtm5xngMIaZXiZk8ROOEJ_OavmLyROiib6vpP0GDgzI5LKgQcWD_UU_6-d4n-pWwrsHilqraxbDpPESyg9aJ1hPXUfBf8EfcN1ZHidL1D1oN4th3hAmaJljPLIsM7775a0UdmgujqnfQ"/>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Navigation Buttons -->
<footer class="fixed bottom-0 left-0 w-full bg-white border-t border-outline-variant p-4 grid grid-cols-2 gap-4 z-50 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<button class="h-12 border border-primary text-primary font-bold rounded-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
            上一步
        </button>
<button class="h-12 bg-primary text-white font-bold rounded-lg flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-md">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
            推播
        </button>
</footer>
<!-- BottomNavBar (Hidden on Desktop, Visible on Mobile via instructions) -->
<nav class="hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-16 px-2 pb-safe bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-[60]">
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-xs font-medium font-['Plus_Jakarta_Sans']">首頁</span>
</div>
<div class="flex flex-col items-center justify-center text-[#c84c8f] bg-pink-50 dark:bg-pink-900/20 rounded-xl px-3 py-1 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-xs font-medium font-['Plus_Jakarta_Sans']">會員管理</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="campaign">campaign</span>
<span class="text-xs font-medium font-['Plus_Jakarta_Sans']">訊息群發</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-xs font-medium font-['Plus_Jakarta_Sans']">設定</span>
</div>
</nav>
</body></html>
