<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 h-16 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 shadow-sm font-['Plus_Jakarta_Sans'] antialiased">
<div class="flex items-center gap-3">
<button class="w-11 h-11 flex items-center justify-center text-slate-500 hover:bg-slate-50 rounded-full transition-colors active:opacity-70">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Wonder sky 國際美妍館</h1>
</div>
<div class="flex items-center gap-2">
<button class="w-11 h-11 flex items-center justify-center text-slate-500 hover:bg-slate-50 rounded-full transition-colors active:opacity-70">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<div class="w-9 h-9 rounded-full bg-surface-variant overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a salon manager in a high-end wellness center. The person is smiling warmly, set against a blurred background of a modern, brightly lit beauty reception with soft pink and white tones. The lighting is flattering and professional, reflecting a clean corporate-modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVf1MxSSDLeI6PWs9E0jX97ZesjB57emEkW78zgH1G8CWeSvY56GHuAK76MfXo1DkJTfriQQRXUldhgA813z7EBtNGkVg43_6HE2n_73F2m7x6TcNnU0bVUDYbkj5yP06uMsBMPLVxL0fRHk31OT_Y9jr3JtRPry5FEwI0o73sScZme2u99fCQpNkLAtwf8-Pa5xYKRKOfpOOOqJz3r2-KW3DHKpwCFQRIJ6oTF8ngxWtH6acn7pY2NQ2hvvBeka-1jGi5t54I_cg"/>
</div>
</div>
</header>
<main class="pt-16 pb-24">
<!-- Breadcrumbs -->
<nav class="px-4 py-3 flex items-center gap-2 text-label-md text-outline">
<span class="font-label-md text-label-md">會員</span>
<span class="material-symbols-outlined text-sm" data-icon="chevron_right">chevron_right</span>
<span class="font-label-md text-label-md text-primary">新增會員</span>
</nav>
<!-- Tab Bar -->
<div class="bg-white border-b border-outline-variant overflow-x-auto hide-scrollbar sticky top-16 z-40">
<div class="flex px-4 min-w-full">
<button class="px-5 py-4 border-b-2 border-primary text-primary font-label-md text-label-md whitespace-nowrap">
                    基本資訊
                </button>
<button class="px-5 py-4 border-b-2 border-transparent text-outline font-label-md text-label-md whitespace-nowrap">
                    會員關係
                </button>
<button class="px-5 py-4 border-b-2 border-transparent text-outline font-label-md text-label-md whitespace-nowrap">
                    會員等級
                </button>
</div>
</div>
<div class="p-4 space-y-6">
<!-- Avatar Upload Section -->
<section class="flex flex-col items-center justify-center py-6 bg-white rounded-xl shadow-sm border border-outline-variant">
<div class="relative group">
<div class="w-24 h-24 rounded-full bg-slate-100 border-2 border-dashed border-outline-variant flex flex-col items-center justify-center text-outline overflow-hidden">
<span class="material-symbols-outlined text-4xl mb-1" data-icon="account_circle">account_circle</span>
<p class="text-[10px] font-medium">大小: 8MB</p>
</div>
<button class="absolute bottom-0 right-0 w-8 h-8 bg-primary text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm" data-icon="photo_camera">photo_camera</span>
</button>
</div>
</section>
<!-- Form: Basic Info -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<div class="w-1 h-5 bg-primary rounded-full"></div>
<h2 class="font-h2 text-h2">基本資訊</h2>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">姓名 <span class="text-error">*</span></label>
<input class="h-12 w-full px-4 rounded-lg border border-error focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="請輸入姓名" type="text" value=""/>
<p class="text-error text-caption font-caption flex items-center gap-1">
<span class="material-symbols-outlined text-xs" data-icon="error">error</span>
                            必需要有姓名
                        </p>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">手機號碼 <span class="text-error">*</span></label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="0912345678" type="tel"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">開發人 <span class="text-error">*</span></label>
<div class="relative">
<select class="h-12 w-full px-4 rounded-lg border border-outline-variant appearance-none focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all bg-white">
<option>請選擇開發人</option>
<option>Sarah Lin</option>
<option>David Wang</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">性別</label>
<div class="flex gap-4 h-12 items-center">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="gender" type="radio"/>
<span class="font-body-md text-body-md">男</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="gender" type="radio"/>
<span class="font-body-md text-body-md">女</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="gender" type="radio"/>
<span class="font-body-md text-body-md">其他</span>
</label>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">生日</label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" type="date"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">Email</label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="example@mail.com" type="email"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">加入日期</label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" type="date" value="2023-10-27"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">職業</label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="請輸入職業" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">居住城市</label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="例如：台北市" type="text"/>
</div>
</div>
</section>
<!-- Membership Relation Section -->
<section class="space-y-4 pt-4 border-t border-outline-variant">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-1 h-5 bg-primary rounded-full"></div>
<h2 class="font-h2 text-h2">會員關係</h2>
</div>
<button class="flex items-center gap-1 text-primary font-label-md text-label-md active:opacity-70 h-11 px-3 border border-primary/20 rounded-lg bg-primary/5">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
                        新增會員關係
                    </button>
</div>
<div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant space-y-3">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">關係名稱</label>
<input class="h-12 w-full px-4 rounded-lg border border-outline-variant bg-white outline-none" placeholder="例如：家人、推薦人" type="text"/>
</div>
</div>
</section>
<!-- Membership Level Section -->
<section class="space-y-4 pt-4 border-t border-outline-variant">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-1 h-5 bg-primary rounded-full"></div>
<h2 class="font-h2 text-h2">會員等級</h2>
</div>
<button class="flex items-center gap-1 text-primary font-label-md text-label-md active:opacity-70 h-11 px-3 border border-primary/20 rounded-lg bg-primary/5">
<span class="material-symbols-outlined text-sm" data-icon="stars">stars</span>
                        新增會員等級
                    </button>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface">等級選擇</label>
<div class="relative">
<select class="h-12 w-full px-4 rounded-lg border border-outline-variant appearance-none focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all bg-white">
<option>黃金會員</option>
<option>白銀會員</option>
<option>一般會員</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-outline pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full h-20 bg-white border-t border-outline-variant px-4 flex items-center justify-between gap-3 shadow-[0_-4px_16px_rgba(0,0,0,0.04)] z-50">
<button class="flex-1 h-12 rounded-lg border border-outline text-on-surface font-label-md text-label-md active:bg-slate-50 transition-colors">
            取消
        </button>
<button class="flex-1 h-12 rounded-lg border border-outline text-on-surface font-label-md text-label-md active:bg-slate-50 transition-colors">
            重設
        </button>
<button class="flex-[1.5] h-12 rounded-lg bg-primary text-white font-label-md text-label-md shadow-md shadow-primary/20 active:opacity-90 active:scale-[0.98] transition-all">
            儲存
        </button>
</footer>
</body></html>
