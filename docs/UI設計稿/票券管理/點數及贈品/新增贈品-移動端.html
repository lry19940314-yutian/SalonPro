<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fbf9f8;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#68594f",
                        "inverse-surface": "#303030",
                        "surface-variant": "#e4e2e1",
                        "on-tertiary-fixed": "#241912",
                        "surface-container": "#f0eded",
                        "outline": "#88717a",
                        "primary-container": "#c14689",
                        "surface": "#fbf9f8",
                        "tertiary-fixed": "#f3dfd1",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#6f6069",
                        "surface-container-high": "#eae8e7",
                        "secondary": "#685a63",
                        "inverse-on-surface": "#f3f0f0",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#d4c2cb",
                        "surface-container-low": "#f6f3f2",
                        "on-secondary": "#ffffff",
                        "on-background": "#1b1c1c",
                        "tertiary-container": "#817267",
                        "surface-bright": "#fbf9f8",
                        "on-secondary-fixed": "#23181f",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#f1dde7",
                        "tertiary-fixed-dim": "#d6c3b6",
                        "on-error-container": "#93000a",
                        "primary": "#a22c70",
                        "on-primary-fixed-variant": "#861259",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "primary-fixed": "#ffd8e7",
                        "on-surface-variant": "#554149",
                        "on-primary-fixed": "#3d0025",
                        "surface-tint": "#a52f72",
                        "surface-dim": "#dcd9d9",
                        "secondary-container": "#f1dde7",
                        "on-tertiary-container": "#fffbff",
                        "inverse-primary": "#ffafd3",
                        "background": "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "primary-fixed-dim": "#ffafd3",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "outline-variant": "#dac0c9",
                        "on-tertiary-fixed-variant": "#51443b",
                        "on-secondary-fixed-variant": "#50434b"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "64px",
                        "md": "24px",
                        "lg": "40px",
                        "gutter": "24px",
                        "xs": "4px",
                        "sm": "12px",
                        "base": "8px",
                        "margin": "32px"
                    },
                    "fontFamily": {
                        "h2": ["Manrope"],
                        "h1": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "button": ["Manrope"],
                        "h3": ["Manrope"],
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "h1": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "button": ["14px", {"lineHeight": "1", "fontWeight": "600"}],
                        "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-gutter h-16 sticky top-0 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant/30 z-40">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">menu</span>
</button>
<h1 class="font-h3 text-h3 font-bold text-primary dark:text-primary-fixed-dim">Wonder Sky</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<div class="w-8 h-8 rounded-full bg-secondary-container overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a woman in a high-end spa environment, reflecting the minimalist and light luxury aesthetic of Wonder Sky. The lighting is soft and flattering with a warm, Morandi-inspired background of muted earth tones and soft pinks. The image conveys sophisticated wellness and professional reliability in a clean, modern style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZGJ6uoJw6SGlsOAsEqdVQar59ForKvcoV65gL_L__FobRYpMBPgvy-PufbMBba5Kj1gQ3hHo3I4Dx1GD0tPFn_34472YgZy5qAeMrOCQvJaQFKaPrHJVZJYBHOUhNAJOMsJewF7z0abhA5Jmmhxcf7dfVRckvwqVFU2q4hYXukLL1UXquO5nzQs03LsCa7inqUAPQtgxgPLDQxBH2JtX3tcfeli5bQVlacaxGa-cCEiWdVrzZ-1eciBcqz7lpGCJHDVxPmXYI110R"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-gutter pt-6 max-w-4xl mx-auto">
<!-- Breadcrumb / Header -->
<div class="flex items-center gap-2 mb-6">
<span class="font-body-lg text-body-lg text-on-surface-variant">票券管理</span>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">chevron_right</span>
<span class="font-body-lg text-body-lg font-semibold text-on-surface">新增贈品</span>
</div>
<!-- Section: Basic Information -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden mb-6">
<!-- Section Header -->
<div class="flex items-center justify-between p-md border-b border-surface-container">
<div class="flex items-center gap-3">
<div class="w-1 h-6 bg-primary rounded-full"></div>
<h2 class="font-h3 text-h3 text-primary">基本資訊</h2>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_less</span>
</div>
<!-- Section Body -->
<div class="p-md space-y-8">
<!-- Image Upload -->
<div class="space-y-sm">
<label class="font-body-md text-on-surface-variant">圖片 (大小: 8MB)</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer text-center">
<span class="material-symbols-outlined text-primary text-[48px] mb-base">cloud_upload</span>
<p class="font-body-md text-on-surface-variant">
                            拖放圖片或是 <span class="text-primary font-semibold underline">點此上傳</span>
</p>
</div>
</div>
<div class="h-px bg-outline-variant/30"></div>
<!-- Toggle Switch -->
<div class="flex items-center justify-between">
<span class="font-body-lg text-body-lg">開啟兌換</span>
<button class="relative inline-flex items-center h-8 rounded-full w-14 bg-primary-container transition-colors">
<span class="translate-x-7 inline-block w-6 h-6 transform bg-white rounded-full transition-transform"></span>
</button>
</div>
<!-- Input Groups -->
<div class="space-y-md">
<!-- Field: Name -->
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 rounded-lg bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface" id="name" placeholder=" " type="text"/>
<label class="absolute left-4 top-1 text-label-caps text-on-surface-variant transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-lg peer-focus:top-1 peer-focus:text-label-caps peer-focus:text-primary" for="name">
                            * 名稱
                        </label>
</div>
<!-- Field: Store Selection -->
<div class="relative">
<select class="peer w-full h-14 px-4 pt-4 rounded-lg bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface appearance-none" id="store">
<option value="all">全分店</option>
<option value="main">總店</option>
<option value="sub">分店 A</option>
</select>
<label class="absolute left-4 top-1 text-label-caps text-on-surface-variant" for="store">
                            * 門店
                        </label>
<span class="material-symbols-outlined absolute right-4 top-4 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
<!-- Field: Points -->
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 rounded-lg bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface" id="points" placeholder=" " type="number" value="0"/>
<label class="absolute left-4 top-1 text-label-caps text-on-surface-variant" for="points">
                            * 兌換所需點數
                        </label>
<div class="absolute right-4 top-4 flex flex-col -space-y-2">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">arrow_drop_up</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Field: Value -->
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 rounded-lg bg-surface-container-low border-transparent focus:border-primary focus:ring-0 transition-all font-body-lg text-on-surface" id="value" placeholder=" " type="number" value="0"/>
<label class="absolute left-4 top-1 text-label-caps text-on-surface-variant" for="value">
                            * 價值(金額)
                        </label>
</div>
</div>
</div>
</section>
</main>
<!-- Footer Actions (Sticky Bottom) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-lg border-t border-outline-variant/20 p-md z-50 flex gap-4">
<button class="flex-1 h-12 bg-secondary-container text-on-secondary-container rounded-full font-button text-button uppercase tracking-wider hover:bg-surface-container-high transition-all active:scale-95">
            取消編輯
        </button>
<button class="flex-[2] h-12 bg-primary text-on-primary rounded-full font-button text-button uppercase tracking-wider shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
            儲存並發佈
        </button>
</footer>
</body></html>
