<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#f1dde7",
                        "inverse-surface": "#303030",
                        "on-surface": "#1b1c1c",
                        "surface-dim": "#dcd9d9",
                        "tertiary-container": "#817267",
                        "surface-bright": "#fbf9f8",
                        "outline-variant": "#dac0c9",
                        "tertiary": "#68594f",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#50434b",
                        "on-error-container": "#93000a",
                        "primary": "#a22c70",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f3f0f0",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#f3dfd1",
                        "surface-container-high": "#eae8e7",
                        "surface": "#fbf9f8",
                        "outline": "#88717a",
                        "on-background": "#1b1c1c",
                        "secondary-fixed-dim": "#d4c2cb",
                        "primary-fixed-dim": "#ffafd3",
                        "on-primary-fixed-variant": "#861259",
                        "inverse-primary": "#ffafd3",
                        "primary-container": "#c14689",
                        "on-secondary": "#ffffff",
                        "surface-container": "#f0eded",
                        "surface-container-low": "#f6f3f2",
                        "surface-container-highest": "#e4e2e1",
                        "secondary-container": "#f1dde7",
                        "on-tertiary-fixed": "#241912",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#d6c3b6",
                        "background": "#fbf9f8",
                        "on-secondary-fixed": "#23181f",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#554149",
                        "surface-tint": "#a52f72",
                        "primary-fixed": "#ffd8e7",
                        "secondary": "#685a63",
                        "on-primary-container": "#fffbff",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e4e2e1",
                        "on-secondary-container": "#6f6069",
                        "on-tertiary-fixed-variant": "#51443b",
                        "on-primary-fixed": "#3d0025"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "base": "8px",
                        "margin": "32px",
                        "lg": "40px",
                        "xs": "4px",
                        "xl": "64px",
                        "sm": "12px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope", "Noto Sans TC"],
                        "button": ["Manrope", "Noto Sans TC"],
                        "h3": ["Manrope", "Noto Sans TC"],
                        "h2": ["Manrope", "Noto Sans TC"],
                        "body-md": ["Manrope", "Noto Sans TC"],
                        "body-lg": ["Manrope", "Noto Sans TC"],
                        "h1": ["Manrope", "Noto Sans TC"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fbf9f8;
            font-family: 'Manrope', 'Noto Sans TC', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #dac0c9;
            border-radius: 10px;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="text-on-surface">
<!-- Header Section (TopAppBar Shared Component Adaptation) -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<div class="flex items-center p-4 justify-between">
<div class="text-on-surface flex size-10 shrink-0 items-center justify-center" data-icon="menu">
<span class="material-symbols-outlined">menu</span>
</div>
<h2 class="text-on-surface text-lg font-bold leading-tight tracking-tight flex-1 px-3">品牌名稱</h2>
<div class="flex items-center gap-2">
<button class="flex size-10 cursor-pointer items-center justify-center rounded-full bg-transparent text-on-surface hover:bg-surface-container">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<div class="size-10 rounded-full border-2 border-primary/20 bg-cover bg-center" data-alt="A professional close-up portrait of a spa manager in a bright, modern wellness center. The lighting is soft and warm, highlighting a calm and professional atmosphere. The background shows blurred elements of a minimalist, light luxury interior with Morandi pink and soft white tones. The overall aesthetic is clean, corporate, and sophisticated." style="background-image: url('https://lh3.googleusercontent.com/aida/ADBb0ujzIS4F-ot4OwR2H2DCG81h32fURCk_ZWqVtkjgAHjr5IlEIfSvDVfq-TfuREcn92fdBd_Il9_62Sgg1YXOXdGc2O0N9N81v7Cn0daI3Eo5umrVb1Wl9khRE4BuQfZQlcQ86nLZodLS8RlEW_G7-YaUGYp2QRuu3qeKTRfxhFj7VKyuh6MiCDOhMvkgPFfIwZzk5_8BOCEsGn4mY8ASFDUj8qtMSLiFzXGKqnA5V-N4QsOHcCHh3Nd2HFzRIzaa3qrklWYbUtIa0A');"></div>
</div>
</div>
</header>
<main class="pb-32 px-4 pt-6 max-w-md mx-auto flex flex-col gap-6">
<!-- Page Title & Subtitle -->
<div class="flex flex-col gap-1">
<h1 class="text-h2 text-on-surface">編輯傭金範本</h1>
<p class="text-body-md text-on-surface-variant">設定不同職位的業績目標與分潤比例</p>
</div>
<!-- Global Settings Section -->
<section class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-label-caps text-on-surface-variant uppercase ml-1">範本資訊</label>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-4 flex flex-col gap-4 shadow-sm">
<div class="flex flex-col gap-2">
<p class="text-body-md font-medium text-on-surface">範本名稱</p>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-low text-on-surface focus:ring-primary focus:border-primary p-3" placeholder="例如：2024 夏季促銷方案" type="text"/>
</div>
<div class="flex flex-col gap-2">
<p class="text-body-md font-medium text-on-surface">適用角色</p>
<div class="relative">
<select class="w-full appearance-none rounded-lg border-outline-variant bg-surface-container-low text-on-surface focus:ring-primary focus:border-primary p-3 pr-10">
<option>美容師</option>
<option>芳療師</option>
<option>店長</option>
<option>實習生</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Distribution Toggle -->
<div class="bg-secondary-container/30 rounded-xl p-4 flex items-center justify-between border border-secondary-fixed">
<div class="flex items-center gap-3">
<div class="p-2 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="account_tree">account_tree</span>
</div>
<div class="flex flex-col">
<span class="text-body-md font-bold text-on-secondary-fixed">啟用分配設定</span>
<span class="text-xs text-on-secondary-container">開啟後可自定義多人分配邏輯</span>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-12 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
<!-- Role Accordion Cards -->
<section class="flex flex-col gap-4">
<label class="text-label-caps text-on-surface-variant uppercase ml-1">分潤規則</label>
<!-- Card 1: Senior Therapist (Expanded) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="p-4 flex items-center justify-between bg-surface-container-low border-b border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="stars">stars</span>
<span class="font-bold text-on-surface">資深美容師</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_less</span>
</div>
<div class="p-4 flex flex-col gap-6">
<!-- Performance Section -->
<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]">trending_up</span>
<span class="text-sm font-bold">業績級距設定</span>
</div>
<div class="flex flex-col gap-3">
<div class="flex items-center gap-3">
<div class="flex-1">
<p class="text-xs text-on-surface-variant mb-1 ml-1">業績門檻</p>
<div class="relative">
<input class="w-full rounded-lg border-outline-variant bg-surface p-4 text-lg font-bold" type="number" value="50000"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-on-surface-variant">元</span>
</div>
</div>
<div class="flex-1">
<p class="text-xs text-on-surface-variant mb-1 ml-1">提成比例</p>
<div class="relative">
<input class="w-full rounded-lg border-outline-variant bg-surface p-4 text-lg font-bold" type="number" value="5"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-on-surface-variant">%</span>
</div>
</div>
</div>
</div>
</div>
<div class="h-px bg-outline-variant/30"></div>
<!-- Commission Section -->
<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]">payments</span>
<span class="text-sm font-bold">固定獎金設定</span>
</div>
<div class="flex flex-col gap-3">
<div class="p-3 bg-surface-container-low rounded-lg flex items-center justify-between">
<span class="text-body-md">全勤獎金</span>
<div class="relative w-32">
<input class="w-full rounded-lg border-outline-variant bg-surface p-2 pr-8 text-right font-bold" type="number" value="2000"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-on-surface-variant">元</span>
</div>
</div>
<div class="p-3 bg-surface-container-low rounded-lg flex items-center justify-between">
<span class="text-body-md">指定技術獎勵</span>
<div class="relative w-32">
<input class="w-full rounded-lg border-outline-variant bg-surface p-2 pr-8 text-right font-bold" type="number" value="10"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-on-surface-variant">%</span>
</div>
</div>
</div>
</div>
<button class="w-full py-3 border-2 border-dashed border-outline-variant rounded-lg text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_circle</span>
<span class="text-sm font-bold">新增業績級距</span>
</button>
</div>
</div>
<!-- Card 2: Junior Therapist (Collapsed) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline" data-icon="person">person</span>
<span class="font-bold text-on-surface">普通美容師</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Add Role Button -->
<button class="w-full py-4 bg-primary/5 border-2 border-dashed border-primary/30 rounded-xl text-primary flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">person_add</span>
<span class="font-bold">新增角色分潤</span>
</button>
</section>
</main>
<!-- Fixed Footer Actions -->
<footer class="fixed bottom-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-lg border-t border-outline-variant p-4 safe-area-bottom">
<div class="max-w-md mx-auto flex gap-3">
<button class="flex-1 py-4 px-6 rounded-full border border-outline text-on-surface font-button hover:bg-surface-container-high transition-colors">
                取消
            </button>
<button class="flex-[2] py-4 px-6 rounded-full bg-primary text-on-primary font-button shadow-lg shadow-primary/20 hover:bg-primary-container transition-colors">
                儲存變更
            </button>
</div>
</footer>
</body></html>
