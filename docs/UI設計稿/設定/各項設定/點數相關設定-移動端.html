<style>
        body { font-family: 'Manrope', sans-serif; background-color: #fbf9f8; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .switch-toggle:checked ~ .switch-dot { transform: translateX(100%); background-color: white; }
        .switch-toggle:checked ~ .switch-bg { background-color: #a22c70; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Bar (Mobile Optimized) -->
<header class="h-16 flex items-center justify-between px-4 sticky top-0 bg-surface/80 backdrop-blur-md z-50 shadow-sm">
<div class="flex items-center gap-sm">
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface">menu</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Wonder Sky</h1>
</div>
<div class="flex items-center gap-sm">
<div class="relative">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<span class="absolute -top-1 -right-1 bg-primary text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">47</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img alt="Lulu Profile" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a sophisticated woman with a warm, friendly smile, set against a soft-focus minimalist salon background. The lighting is high-key and elegant, reflecting a light luxury beauty service aesthetic. The color palette is composed of soft whites, neutral Morandi tones, and subtle hints of warm pink." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3jR202_QdJpaCW3Uf27YKWdsnXyDtHB4au9NkcZU2f_tbCtrkOY9xWcW_nIbPz478Fc9_AlMPDjB2TXy0G2pR1ZZYFoYllDn5c6IfTsPsrrFWMp57AXGIOwHTlgHDAEAlC_cEjAjqZKfykgkUQ8nkq5pN36U0IwYfCcjL32d2-31fJ46KfUHWsWoecOMW--_jNemZqvn9WbxKfgeFWh7TVMh3OW9Z4Wy5ci-r6I5bQZcJY2E9c03LG5o3AxLnEuIxSe_0XeiXkJdB"/>
</div>
</div>
</header>
<!-- Breadcrumb -->
<nav class="px-4 py-3 flex items-center gap-xs font-label-caps text-label-caps text-on-surface-variant">
<span>設定</span>
<span class="material-symbols-outlined text-[14px]">chevron_right</span>
<span class="text-on-surface">各項設定</span>
</nav>
<!-- Horizontal Tabs (Scrollable) -->
<div class="border-b border-surface-container overflow-x-auto hide-scrollbar bg-surface sticky top-16 z-40">
<div class="flex px-4 whitespace-nowrap">
<button class="px-4 py-4 font-button text-button text-on-surface-variant hover:text-primary transition-colors">支付設定</button>
<button class="px-4 py-4 font-button text-button text-on-surface-variant hover:text-primary transition-colors">出單紙設定</button>
<button class="px-4 py-4 font-button text-button text-on-surface-variant hover:text-primary transition-colors">iPad相關設定</button>
<button class="px-4 py-4 font-button text-button text-primary border-b-2 border-primary">點數相關設定</button>
<button class="px-4 py-4 font-button text-button text-on-surface-variant hover:text-primary transition-colors">薪資相關設定</button>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow p-4 pb-32">
<div class="space-y-gutter max-w-md mx-auto">
<!-- Section: 基本設定 -->
<section class="bg-surface-container-lowest p-md rounded-lg shadow-sm">
<div class="flex items-center gap-xs mb-md border-l-4 border-primary pl-3">
<h2 class="font-h2 text-h2 text-on-surface">基本設定</h2>
</div>
<!-- Select Input -->
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant">積點機制</label>
<div class="relative">
<select class="w-full h-14 pl-4 pr-10 bg-surface-container-low border-none rounded-full font-body-md text-on-surface focus:ring-2 focus:ring-primary/20 appearance-none">
<option>不開放積點</option>
<option>開放積點</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="mt-lg pt-4 border-t border-surface-variant/50">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-4">以實收現金為基準，贈送點數(含信用卡及第三方支付)</p>
<div class="grid grid-cols-1 gap-sm">
<div class="bg-surface-container-low p-4 rounded-xl flex items-center justify-between">
<span class="font-body-md">每消費</span>
<div class="flex items-center gap-xs">
<input class="w-16 bg-transparent border-b border-outline text-center font-h3 text-primary focus:border-primary outline-none" type="number" value="1"/>
<span class="font-body-md">元</span>
</div>
</div>
<div class="bg-surface-container-low p-4 rounded-xl flex items-center justify-between">
<span class="font-body-md">可以換</span>
<div class="flex items-center gap-xs">
<input class="w-16 bg-transparent border-b border-outline text-center font-h3 text-primary focus:border-primary outline-none" type="number" value="1"/>
<span class="font-body-md">點</span>
</div>
</div>
</div>
</div>
</section>
<!-- Section: 積點設定 -->
<section class="bg-surface-container-lowest p-md rounded-lg shadow-sm">
<div class="flex items-center gap-xs mb-md border-l-4 border-primary pl-3">
<h2 class="font-h2 text-h2 text-on-surface">積點設定</h2>
</div>
<!-- Input Item -->
<div class="mb-gutter space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant block">加入會員贈送點數</label>
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-full font-body-md text-on-surface focus:ring-2 focus:ring-primary/20" placeholder="500" type="number"/>
</div>
<!-- Switch Item -->
<div class="space-y-md">
<div class="flex items-center justify-between py-2">
<div class="space-y-1">
<p class="font-body-lg font-semibold">服務積點</p>
<p class="text-label-caps text-on-surface-variant">來店消費服務是否能積點</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only switch-toggle" type="checkbox"/>
<div class="w-12 h-6 bg-surface-container-highest rounded-full switch-bg transition-colors"></div>
<div class="absolute left-1 top-1 bg-on-surface-variant w-4 h-4 rounded-full transition-transform switch-dot"></div>
</label>
</div>
<div class="flex items-center justify-between py-2">
<div class="space-y-1">
<p class="font-body-lg font-semibold">商品積點</p>
<p class="text-label-caps text-on-surface-variant">來店購買商品是否能積點</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only switch-toggle" type="checkbox"/>
<div class="w-12 h-6 bg-surface-container-highest rounded-full switch-bg transition-colors"></div>
<div class="absolute left-1 top-1 bg-on-surface-variant w-4 h-4 rounded-full transition-transform switch-dot"></div>
</label>
</div>
<div class="flex items-center justify-between py-2">
<div class="space-y-1">
<p class="font-body-lg font-semibold">儲值積點</p>
<p class="text-label-caps text-on-surface-variant">儲值是否能積點</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only switch-toggle" type="checkbox"/>
<div class="w-12 h-6 bg-surface-container-highest rounded-full switch-bg transition-colors"></div>
<div class="absolute left-1 top-1 bg-on-surface-variant w-4 h-4 rounded-full transition-transform switch-dot"></div>
</label>
</div>
</div>
</section>
<!-- Usage Rules Bento Card -->
<section class="bg-primary-fixed/30 p-md rounded-lg border border-primary-fixed/50">
<div class="flex items-center gap-sm mb-4">
<span class="material-symbols-outlined text-primary">info</span>
<h3 class="font-h3 text-h3 text-on-primary-fixed-variant">使用規則提示</h3>
</div>
<ul class="space-y-sm font-body-md text-on-surface-variant">
<li class="flex items-start gap-xs">
<span class="w-1.5 h-1.5 bg-primary rounded-full mt-2 shrink-0"></span>
<span>只限於開單使用，<span class="text-primary font-bold">購買商品券、優惠券不能積點</span>。</span>
</li>
<li class="flex items-start gap-xs">
<span class="w-1.5 h-1.5 bg-primary rounded-full mt-2 shrink-0"></span>
<span>『使用』儲值金付款是否能積點，請至細項設定。</span>
</li>
</ul>
</section>
</div>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface/90 backdrop-blur-lg border-t border-surface-container-high z-50">
<button class="w-full h-14 bg-primary text-on-primary font-button text-button rounded-full shadow-lg active:scale-95 transition-transform">
            儲存變更
        </button>
</div>
</body></html>
