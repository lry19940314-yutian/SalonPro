<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#fbf9f8",
                    "primary-fixed": "#ffd8e7",
                    "on-secondary-fixed-variant": "#50434b",
                    "on-surface-variant": "#554149",
                    "on-primary-fixed": "#3d0025",
                    "inverse-on-surface": "#f3f0f0",
                    "on-surface": "#1b1c1c",
                    "tertiary-container": "#817267",
                    "secondary-container": "#f1dde7",
                    "on-primary-fixed-variant": "#861259",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#eae8e7",
                    "on-tertiary-fixed": "#241912",
                    "surface-bright": "#fbf9f8",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#d4c2cb",
                    "tertiary-fixed-dim": "#d6c3b6",
                    "background": "#fbf9f8",
                    "secondary-fixed": "#f1dde7",
                    "on-secondary-container": "#6f6069",
                    "error": "#ba1a1a",
                    "primary-container": "#c14689",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#303030",
                    "tertiary-fixed": "#f3dfd1",
                    "on-error": "#ffffff",
                    "on-background": "#1b1c1c",
                    "tertiary": "#68594f",
                    "on-tertiary-container": "#fffbff",
                    "surface-container-low": "#f6f3f2",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#23181f",
                    "surface-container": "#f0eded",
                    "on-tertiary-fixed-variant": "#51443b",
                    "secondary": "#685a63",
                    "outline-variant": "#dac0c9",
                    "surface-container-highest": "#e4e2e1",
                    "surface-dim": "#dcd9d9",
                    "inverse-primary": "#ffafd3",
                    "surface-tint": "#a52f72",
                    "primary-fixed-dim": "#ffafd3",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-variant": "#e4e2e1",
                    "primary": "#a22c70",
                    "outline": "#88717a",
                    "on-primary-container": "#fffbff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin": "32px",
                    "gutter": "24px",
                    "lg": "40px",
                    "xs": "4px",
                    "sm": "12px",
                    "xl": "64px",
                    "md": "24px",
                    "base": "8px"
            },
            "fontFamily": {
                    "button": ["Manrope"],
                    "h2": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "label-caps": ["Manrope"],
                    "h3": ["Manrope"],
                    "body-md": ["Manrope"],
                    "h1": ["Manrope"]
            },
            "fontSize": {
                    "button": ["14px", {"lineHeight": "1", "fontWeight": "600"}],
                    "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "h1": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bottom-sheet-overlay {
            background-color: rgba(27, 28, 28, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<!-- Background Content (Simulating the App Dashboard) -->
<main class="flex-grow p-margin flex flex-col gap-gutter">
<header class="flex justify-between items-center">
<h1 class="font-h1 text-h1 text-primary">Aura Management</h1>
<span class="material-symbols-outlined text-primary text-[32px]">notifications</span>
</header>
<!-- Mock Bento Grid for Context -->
<div class="grid grid-cols-2 gap-base">
<div class="col-span-2 p-md bg-surface-container-low rounded-lg shadow-sm">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-xs">今日預約</p>
<p class="font-h2 text-h2">12 筆預約</p>
</div>
<div class="p-md bg-secondary-container/30 rounded-lg shadow-sm flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-primary" data-icon="layers">layers</span>
<p class="font-body-lg text-body-lg text-on-secondary-container">現有級別</p>
</div>
<div class="p-md bg-surface-container-high rounded-lg shadow-sm flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="badge">badge</span>
<p class="font-body-lg text-body-lg text-on-surface-variant">員工管理</p>
</div>
</div>
<!-- Featured Image for Lifestyle Context -->
<div class="relative h-48 w-full rounded-lg overflow-hidden">
<img alt="Spa reception" class="w-full h-full object-cover" data-alt="A luxurious and minimalist beauty salon reception area with soft pink and beige tones. The space is illuminated by warm, diffused lighting, creating a calm and professional atmosphere. High-end botanical arrangements and clean, modern furniture align with a Morandi-inspired palette, evoking a sense of premium light luxury. The overall aesthetic is serene and sophisticated, reflecting a top-tier wellness brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_-P9am2wPaf_2JtOBU1J25plpLXfc-aPMnQaYF8n9rqt9yEJ29HmRgNjedeXhW00xAX_f9P5wfHEWy5HMTEB8Fx0SUE8ob7_K82KfxSXRESKgRl-p4m9Fcw19Oywl6gsrmhtJM3NShxglIpizVqbNuAGC4y1fndFRw9ENQSImyVHuK09CwZnYIJL1svj7vCdA87bPVgTmzqestsQbN59fAsmOed_d5X779Fd6VBqmCodCmntK6eMibVlf15jq7TJhcPzXQE2aOZ58"/>
</div>
</main>
<!-- Navigation Shell (BottomNavBar suppressed due to focused task, but present for structure) -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 py-2 pb-safe bg-surface dark:bg-surface-container-high shadow-[0_-4px_12px_rgba(0,0,0,0.05)] rounded-t-lg">
<div class="flex flex-col items-center justify-center text-on-surface-variant scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant scale-90">
<span class="material-symbols-outlined" data-icon="event">event</span>
<span class="font-label-caps text-label-caps">Calendar</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-1 scale-90">
<span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span>
<span class="font-label-caps text-label-caps">Levels</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant scale-90">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-label-caps text-label-caps">More</span>
</div>
</nav>
<!-- Bottom Sheet UI: Add Level (新增級別) -->
<div class="fixed inset-0 z-50 flex items-end bottom-sheet-overlay">
<!-- Bottom Sheet Container -->
<div class="w-full bg-surface-container-lowest rounded-t-lg shadow-lg flex flex-col max-h-[795px] overflow-hidden">
<!-- Header Section -->
<div class="px-margin pt-lg pb-md flex justify-between items-center relative">
<!-- Centered Title -->
<div class="absolute inset-x-0 flex justify-center items-center pointer-events-none">
<h2 class="font-h2 text-h2 text-on-surface">新增</h2>
</div>
<div class="flex-grow"></div>
<!-- Large Close Button -->
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full bg-secondary-container/50 text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[28px] font-bold">close</span>
</button>
</div>
<!-- Content Section -->
<div class="px-margin py-md flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-xs" for="level-name">級別名稱</label>
<input autofocus="" class="w-full px-md py-sm bg-surface-container-low border-none rounded-xl text-body-lg font-body-lg focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/50" id="level-name" placeholder="輸入新級別名稱 (例如：高級技師)" type="text"/>
</div>
<!-- Descriptive Hint -->
<p class="text-on-tertiary-fixed-variant text-body-md italic px-xs">
                    級別將用於劃分員工薪資結構與服務權限。
                </p>
</div>
<!-- Action Footer -->
<div class="p-margin pt-sm flex gap-gutter border-t border-surface-variant/30 bg-surface-container-low/20">
<button class="flex-1 py-sm font-button text-button text-primary bg-transparent border-2 border-primary/20 rounded-full active:bg-primary/5 transition-colors">
                    取消
                </button>
<button class="flex-1 py-sm font-button text-button text-on-primary bg-primary rounded-full shadow-md active:scale-[0.98] transition-all">
                    新增
                </button>
</div>
<!-- iPhone Indicator Space -->
<div class="h-base mb-sm"></div>
</div>
</div>
</body></html>
